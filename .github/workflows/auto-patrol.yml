name: 🚨 Auto Patrol - 自动仓库巡逻

on:
  # 每次推送到 main 时触发
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'agent-skills/**'
      - 'skills/**'
      - 'knowledge/**'
      - 'package.json'
      - 'package-lock.json'
      # 2026-09-17 补充：巡逻脚本自身的改动也必须触发巡逻，
      # 否则脚本写坏了没有任何 CI 反馈 —— 这正是此前
      # 「((VAR++)) 中断导致报告静默截断」潜伏多日没人发现的原因。
      - '.github/workflows/**'
      - 'scripts/health-check.mjs'
      - 'scripts/check-links.mjs'
      # 巡逻脚本自检 + 覆盖率期望值配置的改动同样必须触发巡逻，
      # 否则改了配置/测试却没有 CI 反馈（2026-09-17 补）
      - 'scripts/test-patrol-logic.sh'
      - 'scripts/coverage-expectations.json'

  # 每天凌晨 3:00 全量检查
  schedule:
    - cron: '0 3 * * *'

  # 手动触发
  workflow_dispatch:
    inputs:
      patrol_level:
        description: '巡逻级别'
        required: true
        default: 'full'
        type: choice
        options:
          - full        # 全量检查（默认）
          - quick       # 快速检查（仅 P0）
          - coverage    # 仅覆盖分析
      auto_fix:
        description: '自动修复（P0/P1 问题）'
        required: true
        default: true
        type: boolean
      create_issue:
        description: '严重问题自动创建 Issue'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-patrol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # P0: 巡逻脚本自检
      # 为什么放在最前面：巡逻脚本本身出错时会**静默**产出残缺报告
      # （step 有 continue-on-error，失败被吞、workflow 仍显示通过），
      # 2026-09-17 的 ((VAR++)) 事故就是这样潜伏多日的。
      # 先跑自检，脚本有问题立刻红灯，而不是等几天后发现报告少了一半。
      # 注意：本步**故意不加** continue-on-error —— 自检失败必须让 job 失败。
      # ============================================================
      - name: '🧪 [P0] 巡逻脚本自检'
        id: self_test
        run: |
          echo "🧪 开始巡逻脚本自检..."
          bash scripts/test-patrol-logic.sh

      # ============================================================
      # P0: 站点构建检查
      # ============================================================
      - name: '🔨 [P0] 站点构建检查'
        id: build_check
        continue-on-error: true
        run: |
          echo "🛠 开始构建检查..."
          if npm run docs:build 2>&1; then
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "✅ 构建成功"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ 构建失败"
          fi

      # ============================================================
      # P0: 断链检查
      # ============================================================
      - name: '🔗 [P0] 断链检查'
        id: link_check
        continue-on-error: true
        run: |
          echo "🛠 开始断链检查..."
          # 扫描 docs/ 下所有 .md 文件中的 wiki 双链和 markdown 链接
          BROKEN_COUNT=0
          FIXED_COUNT=0
          REPORT_FILE="knowledge/link-report.md"
          
          echo "# 断链检查报告" > "$REPORT_FILE"
          echo "- 检查时间: $(date '+%Y-%m-%d %H:%M')" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          
          # 检查 wiki 双链 [[...]]
          echo "## Wiki 双链检查" >> "$REPORT_FILE"
          for file in $(find docs/ -name "*.md"); do
            # 提取所有 [[link]] 链接
            while IFS= read -r line; do
              if [[ $line =~ \[\[([^]]+)\]\] ]]; then
                link="${BASH_REMATCH[1]}"
                # 去掉 |显示名，只留路径部分（Obsidian 语法 [[路径|显示文字]]）
                link="${link%%|*}"
                # 提取链接目标（去掉 # 锚点部分）
                target="${link%%#*}"
                # 去掉首尾空白 —— 必需：文档里举例写的 [[ ]] 会得到空格，
                # 不 trim 就会被当成文件名去 find，从而误报断链（2026-09-17 修）
                target="$(printf '%s' "$target" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                # 空目标不是链接，跳过
                if [[ -z "$target" ]]; then continue; fi
                # 跳过 Markdown 扩展指令：[[toc]] 由插件渲染成目录，没有对应文件。
                # 此前 4 个日语页面因此被持续误报（2026-09-17 修，
                # 与 scripts/health-check.mjs、scripts/check-links.mjs 的 SKIP_WIKI 一致）
                if [[ "${target,,}" == "toc" || "${target,,}" == "tableofcontents" ]]; then continue; fi
                # 尝试匹配文件（Obsidian 按 basename 匹配）
                found=$(find docs/ -name "${target}.md" 2>/dev/null | head -1)
                if [[ -z "$found" ]]; then
                  # 尝试空格→连字符
                  alt_target=$(echo "$target" | tr ' ' '-')
                  found=$(find docs/ -name "${alt_target}.md" 2>/dev/null | head -1)
                fi
                if [[ -z "$found" ]]; then
                  echo "- ❌ $file → [[$link]]" >> "$REPORT_FILE"
                  # 同上：不可用 ((VAR++))，set -e 下 0→1 会中断 step
                  BROKEN_COUNT=$((BROKEN_COUNT + 1))
                fi
              fi
            done < <(grep -oP '\[\[[^\]]+\]\]' "$file" 2>/dev/null || true)
          done
          
          echo "" >> "$REPORT_FILE"
          echo "## 统计" >> "$REPORT_FILE"
          echo "- 断链数: $BROKEN_COUNT" >> "$REPORT_FILE"
          
          echo "status=$([ $BROKEN_COUNT -eq 0 ] && echo 'passed' || echo 'warning')" >> $GITHUB_OUTPUT
          echo "broken_count=$BROKEN_COUNT" >> $GITHUB_OUTPUT
          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          echo "📊 断链统计: $BROKEN_COUNT 处"

      # ============================================================
      # P1: 知识库质量体检
      # ============================================================
      - name: '📋 [P1] 知识库质量体检'
        id: quality_check
        continue-on-error: true
        run: |
          echo "🛠 开始质量体检..."
          REPORT_FILE="knowledge/quality-report.md"
          ISSUES=0
          
          echo "# 知识库质量体检报告" > "$REPORT_FILE"
          echo "- 检查时间: $(date '+%Y-%m-%d %H:%M')" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          
          # 检查标题跳级
          echo "## 标题层级检查" >> "$REPORT_FILE"
          for file in $(find docs/posts/ -name "*.md"); do
            prev_level=0
            while IFS= read -r line; do
              if [[ $line =~ ^(#+)\ (.*) ]]; then
                level=${#BASH_REMATCH[1]}
                if [[ $prev_level -gt 0 && $((level - prev_level)) -gt 1 ]]; then
                  echo "- ⚠️ $file: 标题跳级 '#$(printf '#%.0s' $(seq 1 $prev_level))' → '$line'" >> "$REPORT_FILE"
                  # 注意：不要写 ((VAR++))。在 GitHub Actions 默认的 `bash -e` 下，
                  # ((VAR++)) 当 VAR 从 0 变 1 时返回退出码 1，会导致整个 step 静默中断，
                  # 后续检查全部不执行、报告只留第一条。必须用 VAR=$((VAR + 1))。（2026-09-17 修）
                  ISSUES=$((ISSUES + 1))
                fi
                prev_level=$level
              fi
            done < "$file"
          done
          
          # 检查文件编码
          echo "" >> "$REPORT_FILE"
          echo "## 编码检查" >> "$REPORT_FILE"
          for file in $(find docs/ -name "*.md"); do
            if file "$file" | grep -q "BOM"; then
              echo "- ⚠️ $file: 包含 BOM 头" >> "$REPORT_FILE"
              ISSUES=$((ISSUES + 1))
            fi
            if grep -qP '\x{FFFD}' "$file" 2>/dev/null; then
              echo "- ❌ $file: 包含乱码字符" >> "$REPORT_FILE"
              ISSUES=$((ISSUES + 1))
            fi
          done
          
          echo "" >> "$REPORT_FILE"
          echo "## 统计" >> "$REPORT_FILE"
          echo "- 发现问题: $ISSUES 处" >> "$REPORT_FILE"
          
          echo "status=$([ $ISSUES -eq 0 ] && echo 'passed' || echo 'warning')" >> $GITHUB_OUTPUT
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT
          echo "📊 质量体检: $ISSUES 处问题"

      # ============================================================
      # P1: 索引一致性检查
      # ============================================================
      - name: '📑 [P1] 索引一致性检查'
        id: index_check
        continue-on-error: true
        run: |
          echo "🛠 开始索引一致性检查..."
          MISSING_INDEX=0
          REPORT_FILE="knowledge/index-report.md"
          
          echo "# 索引一致性检查报告" > "$REPORT_FILE"
          echo "- 检查时间: $(date '+%Y-%m-%d %H:%M')" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          
          # 检查各内容目录是否有 index.md
          for dir in docs/posts/*/notes/ docs/posts/*/topics/; do
            if [[ -d "$dir" ]]; then
              if [[ ! -f "${dir}index.md" ]]; then
                echo "- ❌ $dir: 缺少 index.md" >> "$REPORT_FILE"
                MISSING_INDEX=$((MISSING_INDEX + 1))
              fi
            fi
          done
          
          # 检查源目录 vs docs 同步状态
          echo "" >> "$REPORT_FILE"
          echo "## 源目录 vs 站点目录对照" >> "$REPORT_FILE"
          declare -A SOURCE_MAP
          SOURCE_MAP["高等数学"]="docs/posts/math/notes"
          SOURCE_MAP["政治理论"]="docs/posts/politics/notes"
          SOURCE_MAP["编程技能/专升本英语/笔记"]="docs/posts/english/notes"
          
          for src in "${!SOURCE_MAP[@]}"; do
            dst="${SOURCE_MAP[$src]}"
            if [[ -d "$src" && -d "$dst" ]]; then
              # 排除站点侧自动生成的 index.md，它不是源文件的对应物
              src_count=$(find "$src" -name "*.md" ! -name "index.md" | wc -l)
              dst_count=$(find "$dst" -name "*.md" ! -name "index.md" | wc -l)
              # 2026-09-17 修正口径：
              # 原逻辑「数量不等即告警」会把「站点侧多出独立维护的页面」误报为问题
              # （例：编程技能/专升本英语/笔记 7 篇 ↔ docs/posts/english/notes 10 篇，
              #   实为 7 篇一一对应 + 3 篇站点独有的 cloze/matching/agreement-exercises，
              #   并非同步丢失）。这导致每天一条噪音告警，最终会让人忽略真告警。
              # 现改为：只在「站点侧少于源侧」时告警（那才可能是同步丢了内容）。
              if [[ $dst_count -lt $src_count ]]; then
                echo "- ⚠️ $src ($src_count) → $dst ($dst_count): 站点侧少 $((src_count - dst_count)) 篇，疑似同步丢失" >> "$REPORT_FILE"
                MISSING_INDEX=$((MISSING_INDEX + 1))
              elif [[ $dst_count -gt $src_count ]]; then
                echo "- ✅ $src ($src_count) → $dst ($dst_count): 站点侧多 $((dst_count - src_count)) 篇（独立维护，非丢失）" >> "$REPORT_FILE"
              else
                echo "- ✅ $src → $dst: 一致 ($src_count 文件)" >> "$REPORT_FILE"
              fi
            fi
          done
          
          echo "" >> "$REPORT_FILE"
          echo "## 统计" >> "$REPORT_FILE"
          echo "- 问题数: $MISSING_INDEX" >> "$REPORT_FILE"
          
          echo "status=$([ $MISSING_INDEX -eq 0 ] && echo 'passed' || echo 'warning')" >> $GITHUB_OUTPUT
          echo "📊 索引检查: $MISSING_INDEX 处问题"

      # ============================================================
      # P2: 知识点覆盖率分析
      # ============================================================
      - name: '📊 [P2] 知识点覆盖率分析'
        # 定时巡逻也要跑。此前条件只有 inputs.patrol_level，而 schedule 触发时
        # inputs.* 为空串 → 条件恒假 → 覆盖率报告长期不更新（2026-09-17 修）。
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          inputs.patrol_level == 'full' ||
          inputs.patrol_level == 'coverage'
        continue-on-error: true
        run: |
          echo "🛠 开始覆盖分析..."
          # ⚠️ 只写 *-auto.md。knowledge/coverage-report.md 是 2026-08-18 的
          # 人工复核修正版（纠正「按文件大小误判空占位」、说明真题来源类型），
          # 脚本此前直接 `> coverage-report.md` 覆写它，一次手动 full 巡逻
          # 就会永久抹掉那份内容。机器产物与人工产物必须分文件。（2026-09-17 修）
          REPORT_FILE="knowledge/coverage-report-auto.md"

          # 期望值外置到配置文件，避免硬编码失真：原先 math_expected=36 而实际
          # 已有 70 篇，算出来 194%、cs 220%，数字荒谬却长期无人发现。
          EXPECT_FILE="scripts/coverage-expectations.json"
          # 三级回退读取：jq → node → 内置默认值。
          # 只用 jq 不够稳（本机开发环境就没有 jq），而 node 是本 workflow
          # 必然存在的（前面 setup-node + npm ci 已保证），所以作为第二选择，
          # 避免配置读不到时又退回硬编码的荒谬百分比。
          read_expect() { # $1=key $2=default
            local v=""
            if [[ -f "$EXPECT_FILE" ]]; then
              if command -v jq >/dev/null 2>&1; then
                v="$(jq -r --arg k "$1" '.[$k] // empty' "$EXPECT_FILE" 2>/dev/null || true)"
              fi
              if [[ -z "$v" || "$v" == "null" ]] && command -v node >/dev/null 2>&1; then
                v="$(node -e "try{const c=JSON.parse(require('fs').readFileSync('$EXPECT_FILE','utf8'));process.stdout.write(c['$1']!=null?String(c['$1']):'')}catch(e){}" 2>/dev/null || true)"
              fi
            fi
            if [[ -n "$v" && "$v" != "null" ]]; then echo "$v"; else echo "$2"; fi
          }
          math_expected="$(read_expect math 36)"
          cs_expected="$(read_expect cs 20)"
          po_expected="$(read_expect po 18)"

          # 目录缺失时必须报警，不能让 find 的报错被 wc -l 吞成 0
          count_md() {
            local d="$1"; shift
            if [[ ! -d "$d" ]]; then echo "MISSING"; return; fi
            find "$d" -name "*.md" "$@" 2>/dev/null | wc -l | tr -d ' '
          }
          # >100% 说明期望值过期，必须显式提示而不是输出荒谬百分比
          pct_of() {
            if [[ "$2" == "MISSING" || "$2" -le 0 ]]; then echo "N/A"; return; fi
            if [[ "$1" == "MISSING" ]]; then echo "N/A"; return; fi
            local p=$(( $1 * 100 / $2 ))
            if [[ $p -gt 100 ]]; then echo "${p}% ⚠️超预期"; else echo "${p}%"; fi
          }
          cell() { [[ "$1" == "MISSING" ]] && echo "⚠️ 目录缺失" || echo "$1"; }

          {
            echo "# 知识点覆盖率分析报告（机器生成版）"
            echo "- 分析时间: $(date '+%Y-%m-%d %H:%M')"
            echo "- ⚠️ 本文件由巡逻脚本自动生成，**不要手工编辑**，每次巡逻都会被覆写。"
            echo "  人工复核结论请写在 [coverage-report.md](./coverage-report.md)。"
            echo ""
            echo "## 高等数学"
            math_actual="$(count_md docs/posts/math/notes/ ! -name 'index.md' ! -name 'syllabus.md')"
            echo "- 期望: $math_expected 章节"
            echo "- 实际: $(cell "$math_actual") 文件"
            echo "- 覆盖率: $(pct_of "$math_actual" "$math_expected")"
            echo ""
            echo "## 计算机基础与程序设计"
            cs_actual="$(count_md docs/posts/computer/notes/ ! -name 'index.md' ! -name 'syllabus.md')"
            echo "- 期望: $cs_expected 考点"
            echo "- 实际: $(cell "$cs_actual") 文件"
            echo "- 覆盖率: $(pct_of "$cs_actual" "$cs_expected")"
            echo ""
            echo "## 英语"
            en_actual="$(count_md docs/posts/english/notes/ ! -name 'index.md')"
            echo "- 笔记模块: $(cell "$en_actual") 个"
            en_years="$(count_md docs/posts/english/ ! -name 'index.md' -maxdepth 1)"
            echo "- 真题年份: $(cell "$en_years") 年"
            echo ""
            echo "## 政治理论"
            po_actual="$(count_md docs/posts/politics/notes/ ! -name 'index.md')"
            echo "- 期望: $po_expected 模块"
            echo "- 实际: $(cell "$po_actual") 文件"
            echo "- 覆盖率: $(pct_of "$po_actual" "$po_expected")"
            echo ""
            echo "## 总体概览"
            echo "| 科目 | 覆盖率 |"
            echo "|:---|:---:|"
            echo "| 高等数学 | $(pct_of "$math_actual" "$math_expected") |"
            echo "| 计算机 | $(pct_of "$cs_actual" "$cs_expected") |"
            echo "| 政治 | $(pct_of "$po_actual" "$po_expected") |"
            echo ""
            echo "> 期望值来自 \`$EXPECT_FILE\`；出现「⚠️超预期」表示该科目笔记数已超过期望值，"
            echo "> 应更新配置里的期望值，否则覆盖率失去参考意义。"
          } > "$REPORT_FILE"

          echo "✅ 覆盖率报告已生成: $REPORT_FILE"

      # ============================================================
      # 生成综合报告
      # ============================================================
      - name: '📝 生成综合巡逻报告'
        id: generate_report
        run: |
          REPORT_FILE="knowledge/patrol-report-$(date '+%Y%m%d').md"
          
          {
            echo "# 🚨 自动巡逻报告"
            echo "- 巡逻时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "- 触发方式: ${{ github.event_name }}"
            echo "- 巡逻级别: ${{ inputs.patrol_level || 'full' }}"
            echo ""
            echo "## ✅ 检查结果"
            echo ""
            echo "| 检查项 | 状态 | 详情 |"
            echo "|:---|:---:|:---|"
            
            # 巡逻脚本自检（无 continue-on-error，能跑到这里即代表通过）
            if [[ "${{ steps.self_test.outcome }}" == "success" ]]; then
              echo "| 🧪 巡逻脚本自检 | ✅ 通过 | 8 项功能 + 7 项防回归扫描 |"
            else
              echo "| 🧪 巡逻脚本自检 | ❌ 失败 | 脚本逻辑有问题，报告可能不可信 |"
            fi

            # 构建检查
            BUILD_STATUS="${{ steps.build_check.outputs.status }}"
            if [[ "$BUILD_STATUS" == "passed" ]]; then
              echo "| 🔨 站点构建 | ✅ 通过 | 构建成功 |"
            else
              echo "| 🔨 站点构建 | ❌ 失败 | 请检查构建日志 |"
            fi
            
            # 断链检查
            LINK_STATUS="${{ steps.link_check.outputs.status }}"
            BROKEN="${{ steps.link_check.outputs.broken_count }}"
            if [[ "$LINK_STATUS" == "passed" ]]; then
              echo "| 🔗 链接检查 | ✅ 通过 | 无断链 |"
            else
              echo "| 🔗 链接检查 | ⚠️ 警告 | $BROKEN 处断链 |"
            fi
            
            # 质量检查
            QUALITY_STATUS="${{ steps.quality_check.outputs.status }}"
            QUALITY_ISSUES="${{ steps.quality_check.outputs.issues }}"
            if [[ "$QUALITY_STATUS" == "passed" ]]; then
              echo "| 📋 质量体检 | ✅ 通过 | 无问题 |"
            else
              echo "| 📋 质量体检 | ⚠️ 警告 | $QUALITY_ISSUES 处问题 |"
            fi
            
            # 索引检查
            INDEX_STATUS="${{ steps.index_check.outputs.status }}"
            if [[ "$INDEX_STATUS" == "passed" ]]; then
              echo "| 📑 索引一致性 | ✅ 通过 | 全部一致 |"
            else
              echo "| 📑 索引一致性 | ⚠️ 警告 | 存在不一致 |"
            fi
            
            # 覆盖率（仅 full/coverage/定时巡逻会生成）
            if [[ -f knowledge/coverage-report-auto.md ]]; then
              echo "| 📊 覆盖率分析 | ℹ️ 参考 | 见 coverage-report-auto.md |"
            fi
          } > "$REPORT_FILE"

          # 统计项数不再写死「4」：步骤增减后写死的数字会与实际脱钩，
          # 让报告自己说谎。改为数表格正文行数（表头是 `| 检查项 | ...`，
          # 分隔行是 `|:---|...` 不匹配 `^| `，故减 1 即得正文行数）。（2026-09-17 修）
          # 注意：必须等上面的重定向关闭后再读文件，否则读到的是写入中的缓冲内容。
          CHECKED_ROWS="$(grep -c '^| ' "$REPORT_FILE" || true)"
          CHECKED=$(( ${CHECKED_ROWS:-0} - 1 ))
          [[ $CHECKED -lt 0 ]] && CHECKED=0

          {
            echo ""
            echo "## 📊 统计摘要"
            echo "- 总检查项: $CHECKED"
            echo "- 详细报告:"
            echo "  - 断链报告: knowledge/link-report.md"
            echo "  - 质量报告: knowledge/quality-report.md"
            echo "  - 索引报告: knowledge/index-report.md"
            echo "  - 覆盖报告（机器版）: knowledge/coverage-report-auto.md"
            echo "  - 覆盖报告（人工复核版）: knowledge/coverage-report.md"
            echo ""
            echo "> 报告仅保留最近 30 份，更早的由巡逻脚本自动轮转清理。"
            echo ""
            echo "---"
            echo "*由 Auto Patrol Workflow 自动生成*"
          } >> "$REPORT_FILE"

          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          echo "✅ 综合报告已生成: $REPORT_FILE"

      # ============================================================
      # 提交检查结果到仓库
      # ============================================================
      - name: '📤 提交检查报告'
        if: always()
        run: |
          git config user.name "Auto Patrol Bot"
          git config user.email "auto-patrol@darling016123"

          # ------------------------------------------------------------
          # 报告轮转：每天新增一个 patrol-report-YYYYMMDD.md，此前从不清理，
          # 已堆积 30 份（2026-08-18 起）且会无限增长到 365 份/年，
          # 让 knowledge/ 目录被噪声淹没。保留最近 30 份，更早的删除。
          # （2026-09-17 修）
          # ------------------------------------------------------------
          KEEP=30
          mapfile -t ALL_REPORTS < <(ls -1 knowledge/patrol-report-*.md 2>/dev/null | sort)
          TOTAL=${#ALL_REPORTS[@]}
          if [[ $TOTAL -gt $KEEP ]]; then
            REMOVE=$((TOTAL - KEEP))
            echo "🧹 报告轮转：共 $TOTAL 份，保留最近 $KEEP 份，清理 $REMOVE 份"
            for ((i = 0; i < REMOVE; i++)); do
              echo "  - 删除 ${ALL_REPORTS[$i]}"
              rm -f "${ALL_REPORTS[$i]}"
            done
          else
            echo "ℹ️ 报告轮转：共 $TOTAL 份，未超过上限 $KEEP，无需清理"
          fi

          # 注意：knowledge/coverage-report.md 是人工复核版，**不加入**自动提交，
          # 防止脚本产物覆盖人工结论。脚本只写 coverage-report-auto.md。
          git add knowledge/patrol-report-*.md knowledge/link-report.md \
                  knowledge/quality-report.md knowledge/index-report.md \
                  knowledge/coverage-report-auto.md 2>/dev/null || true
          # 记录被轮转删除的文件
          git add -u knowledge/ 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "🚨 auto-patrol: $(date '+%Y-%m-%d') 巡检报告自动提交"
            # push 失败时自动 rebase 重试（最多 3 次），避免并发冲突
            for i in 1 2 3; do
              if git push; then
                echo "✅ 报告已提交"
                break
              fi
              echo "⚠️ push 冲突，第 $i 次 rebase 重试..."
              # rebase 若因冲突中断，必须 abort 回到干净状态，
              # 否则会残留冲突标记（<<<<<<<）并让后续每次 push 都失败，
              # 3 次循环结束后静默退出、报告丢失。（2026-09-17 修）
              if ! git pull --rebase origin main; then
                echo "❌ rebase 冲突，回滚本次 rebase 以避免污染工作区"
                git rebase --abort 2>/dev/null || true
                git reset --hard HEAD
                echo "::warning title=巡逻报告推送失败::rebase 冲突已回滚，报告未能推送，请人工检查"
                break
              fi
              if [[ $i -eq 3 ]]; then
                echo "::warning title=巡逻报告推送失败::重试 3 次仍失败，报告未能推送"
              fi
            done
          else
            echo "ℹ️ 无新报告需要提交"
          fi

      # ============================================================
      # 严重问题自动创建 Issue
      # ============================================================
      # ============================================================
      # 严重问题自动创建 / 更新 Issue（带去重）
      # ============================================================
      - name: '🐛 严重问题自动创建 Issue'
        if: >
          always() &&
          (steps.build_check.outputs.status == 'failed' ||
           steps.link_check.outputs.broken_count > '0') &&
          (github.event_name == 'schedule' || github.event_name == 'push' || inputs.create_issue == true)
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ steps.build_check.outputs.status }}';
            const brokenCount = parseInt('${{ steps.link_check.outputs.broken_count }}' || '0', 10) || 0;

            let issueBody = '## 🚨 自动巡逻发现严重问题\n\n';
            issueBody += `- 巡逻时间: ${new Date().toISOString()}\n`;
            issueBody += `- 触发方式: ${{ github.event_name }}\n\n`;

            if (buildStatus === 'failed') {
              issueBody += '### ❌ P0: 站点构建失败\n';
              issueBody += '请检查构建日志，修复构建错误。\n\n';
            }

            if (brokenCount > 0) {
              issueBody += `### ⚠️ P1: 发现 ${brokenCount} 处断链\n`;
              issueBody += '请查看 knowledge/link-report.md 了解详情。\n\n';
            }

            issueBody += '---\n*由 Auto Patrol Workflow 自动创建*';

            // ------------------------------------------------------------
            // 去重：此前每次定时巡逻都无条件新建 Issue，导致同一天起
            // 每天一个「[自动巡逻] YYYY-MM-DD 质量报告」，到 2026-09-17
            // 已堆积 13 个未关闭 Issue，且没有任何自动关闭逻辑。
            // 改为：已有未关闭的巡逻 Issue → 追加评论；否则才新建。（2026-09-17 修）
            // ------------------------------------------------------------
            const LABEL = 'auto-patrol';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              per_page: 5,
              sort: 'created',
              direction: 'desc'
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `### 🔁 巡逻复现（${new Date().toISOString().split('T')[0]}）\n\n${issueBody}`
              });
              console.log(`已存在未关闭的巡逻 Issue #${issue.number}，改为追加评论，未新建。`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[自动巡逻] ${new Date().toISOString().split('T')[0]} 质量报告`,
                body: issueBody,
                labels: [LABEL, 'quality-report']
              });
              console.log(`已新建巡逻 Issue #${created.data.number}`);
            }

      # ============================================================
      # 全部检查通过时自动关闭遗留的巡逻 Issue
      # ============================================================
      - name: '✅ 全绿时自动关闭巡逻 Issue'
        if: >
          always() &&
          steps.build_check.outputs.status == 'passed' &&
          steps.link_check.outputs.status == 'passed' &&
          (github.event_name == 'schedule' || github.event_name == 'push')
        uses: actions/github-script@v7
        with:
          script: |
            // 检查全绿时，把历史遗留的巡逻 Issue 关闭，避免「已修复但仍挂着
            // 十几个红色 Issue」的假警报状态。这是上一步只做去重、不做收敛的补充。
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'auto-patrol', per_page: 100
            });

            if (open.data.length === 0) {
              console.log('无遗留巡逻 Issue，无需处理。');
              return;
            }

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '✅ 本次巡逻全部检查通过（构建 / 断链 / 质量 / 索引），自动关闭此 Issue。\n\n*由 Auto Patrol Workflow 自动关闭*'
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed'
              });
            }
            console.log(`已自动关闭 ${open.data.length} 个遗留巡逻 Issue。`);