name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Diagnostics
        run: |
          node --version
          npm --version
          git log --oneline -3
          echo "--- npm config ---"
          npm config get registry

      - name: Install
        run: npm ci

      - name: Build
        env:
          GITHUB_ACTIONS: true
          # ★ 2026-09-23：把 Node 堆上限从默认 ~4 GB 提到 8 GB。
          #   为什么必须显式设：站点从 316 页长到 405 页（docs/ +132k 行）后，
          #   VitePress 的 "building client + server bundles" 阶段会突破默认上限，
          #   报 `FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap
          #   out of memory` 并以退出码 134 失败（run 35786037737 实测）。
          #   注意：机器人（Auto Patrol）的提交是拿 GITHUB_TOKEN 推的，**不会触发**
          #   本工作流 —— 所以 2026-09-17 之后的站点增长一直没被 CI 构建过，
          #   直到本次人工推送才暴露出来。
          #   ubuntu-latest runner 有 16 GB 内存，8 GB 堆安全。
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      # 跨项目联动：构建成功后通知 ai-learning-assistant 重建 RAG 知识库
      # 前提：仓库配置 PAT（Actions secrets → RAG_TRIGGER_TOKEN，需 repo 权限）
      # 未配置时该步骤静默跳过，ai-learning-assistant 每天凌晨 4:00 仍有兜底重建
      #
      # ⚠️ 2026-09-17 修：原写法 `if: success() && env.RAG_TRIGGER_TOKEN != ''`
      # 是**死代码** —— RAG_TRIGGER_TOKEN 定义在本 step 自己的 env 里，
      # 而 step 级 `if` 在 env 生效**之前**求值，因此该条件恒为假，
      # 这步从未真正执行过。改为在 run 内部判断（run 里 env 一定已注入）。
      #
      # 同时给 curl 加 -f：原写法 curl 对 HTTP 4xx/5xx 仍返回 0，
      # 于是无论成功失败都打印「✅ 已通知」，属于假成功。
      - name: 🔄 通知 ai-learning-assistant 重建 RAG
        if: success()
        env:
          RAG_TRIGGER_TOKEN: ${{ secrets.RAG_TRIGGER_TOKEN }}
        run: |
          if [[ -z "$RAG_TRIGGER_TOKEN" ]]; then
            echo "ℹ️ 未配置 RAG_TRIGGER_TOKEN，跳过（依赖 ai-learning-assistant 每日 04:00 兜底重建）"
            exit 0
          fi
          HTTP_CODE=$(curl -s -f -o /tmp/rag_resp.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RAG_TRIGGER_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/wpc725562-dotcom/ai-learning-assistant/dispatches \
            -d '{"event_type":"rag-rebuild"}')
          if [[ "$HTTP_CODE" == "204" ]]; then
            echo "✅ 已通知 ai-learning-assistant 重建 RAG (HTTP $HTTP_CODE)"
          else
            echo "::warning title=RAG 通知失败::HTTP $HTTP_CODE，依赖每日兜底重建"
            echo "响应体: $(cat /tmp/rag_resp.txt 2>/dev/null | head -c 300)"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
