<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>政治两本教材 · 全部考点</title>
<style>
  :root {
    --bg: #140f14;
    --panel: rgba(36, 26, 32, .82);
    --panel-solid: #241a20;
    --text: #f2e8ec;
    --dim: #a89aa2;
    --pink: #f8b4c4;
    --pink-dim: #c98a9a;
    --grid: rgba(248, 180, 196, .12);
    --line: rgba(248, 180, 196, .16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
  }
  /* 暗色网格背景 */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -2;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: center center;
    pointer-events: none;
  }
  /* 樱花色径向光晕 */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse 900px 500px at 18% 0%, rgba(248,180,196,.10), transparent 62%),
      radial-gradient(ellipse 760px 460px at 88% 12%, rgba(201,138,154,.09), transparent 60%),
      radial-gradient(ellipse 620px 420px at 50% 100%, rgba(248,180,196,.05), transparent 65%);
  }
  /* 樱花粒子画布 */
  #petals {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  /* 阅读进度条 */
  #prog {
    position: fixed; top: 0; left: 0; height: 3px; width: 0;
    background: linear-gradient(90deg, #f8b4c4, #ffd9e2, #f8b4c4);
    box-shadow: 0 0 10px rgba(248,180,196,.65);
    z-index: 100; transition: width .1s linear;
  }

  .head {
    position: sticky; top: 0; z-index: 30;
    background: rgba(20, 15, 20, .82);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding: 16px 28px 12px;
  }
  .head h1 {
    font-size: 18px; font-weight: 600; margin: 0 0 3px;
    color: #fff; letter-spacing: .3px;
  }
  .head h1 em { font-style: normal; color: var(--pink); }
  .head .meta { font-size: 12px; color: var(--dim); }
  .bar { display: flex; gap: 9px; margin-top: 11px; flex-wrap: wrap; align-items: center; }
  #q {
    flex: 1; min-width: 210px; padding: 8px 14px; font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 20px; outline: none;
    background: rgba(255,255,255,.045); color: var(--text);
    transition: all .18s;
  }
  #q::placeholder { color: #6e6068; }
  #q:focus { border-color: var(--pink-dim); background: rgba(255,255,255,.07); }
  .chip {
    padding: 6px 14px; font-size: 12.5px; border-radius: 16px;
    border: 1px solid var(--line); background: rgba(255,255,255,.04);
    color: var(--dim); cursor: pointer; user-select: none; transition: all .18s;
  }
  .chip:hover { border-color: var(--pink-dim); color: var(--text); }
  .chip.on {
    background: rgba(248,180,196,.16); border-color: var(--pink);
    color: #ffd9e2; font-weight: 500;
  }

  .wrap { max-width: 1060px; margin: 0 auto; padding: 22px 28px 200px; position: relative; z-index: 1; }
  .book {
    margin: 26px 0 10px; font-size: 16px; font-weight: 600;
    display: flex; align-items: center; gap: 10px; color: #fff;
  }
  .book::before {
    content: ''; width: 3px; height: 15px; border-radius: 2px;
    background: linear-gradient(180deg, var(--pink), transparent);
  }
  .book .cnt { font-size: 12px; font-weight: 400; color: var(--dim); }

  .chap {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; margin: 9px 0; overflow: hidden;
    backdrop-filter: blur(8px);
    transition: border-color .18s, box-shadow .18s;
  }
  .chap:hover { border-color: rgba(248,180,196,.32); box-shadow: 0 4px 20px rgba(0,0,0,.3); }
  .chap > summary {
    padding: 13px 18px; cursor: pointer; font-size: 14px; font-weight: 500;
    list-style: none; display: flex; justify-content: space-between;
    align-items: center; color: var(--text);
  }
  .chap > summary::-webkit-details-marker { display: none; }
  .chap > summary:hover { background: rgba(248,180,196,.05); }
  .chap > summary .n { color: var(--dim); font-size: 12px; font-weight: 400; }
  .chap[open] > summary { border-bottom: 1px solid var(--line); }

  .items { }
  .item { padding: 12px 18px; border-bottom: 1px solid rgba(248,180,196,.07); }
  .item:last-child { border-bottom: none; }
  .item .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .item .name { font-weight: 500; font-size: 13.5px; color: #fff; }
  .item .freq { color: var(--pink); font-size: 12px; letter-spacing: 1px; }
  .item .types {
    font-size: 11.5px; color: var(--pink-dim);
    background: rgba(248,180,196,.1); border: 1px solid rgba(248,180,196,.18);
    padding: 1px 8px; border-radius: 9px;
  }
  .item .concl { margin-top: 5px; font-size: 12.5px; color: var(--dim); line-height: 1.78; }
  .empty { text-align: center; color: var(--dim); padding: 70px 0; font-size: 13px; }
  mark { background: rgba(248,180,196,.32); color: #fff; padding: 0 2px; border-radius: 2px; }

  /* 右下角按钮组 */
  .dock {
    position: fixed; right: 22px; bottom: 24px; z-index: 40;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .fbtn {
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: rgba(36,26,32,.9);
    backdrop-filter: blur(10px); color: var(--pink);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; transition: all .2s; user-select: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  .fbtn:hover {
    border-color: var(--pink); background: rgba(248,180,196,.16);
    transform: translateY(-2px); box-shadow: 0 6px 22px rgba(248,180,196,.2);
  }
  .fbtn.on { background: rgba(248,180,196,.22); border-color: var(--pink); }
  .fbtn .dot {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pink); transform: translate(15px, -15px);
    opacity: 0; transition: opacity .2s;
  }
  .fbtn.on .dot { opacity: 1; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  /* Live2D 容器 */
  #live2d {
    position: fixed; right: 8px; bottom: 96px; z-index: 35;
    width: 220px; height: 320px; pointer-events: none;
    opacity: .96; transition: opacity .3s, transform .3s;
  }
  #live2d.hide { opacity: 0; transform: translateY(20px) scale(.9); pointer-events: none; }
  #live2d canvas { pointer-events: auto; }
  /* L2Dwidget 自己建的 canvas：去掉虚线框、贴右下 */
  #live2dcanvas, canvas#live2dcanvas, .live2d-widget, .live2d-widget canvas {
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    background: transparent !important;
  }
  #live2dcanvas {
    right: 6px !important;
    bottom: 90px !important;
    z-index: 34 !important;
  }
  #live2d.hide ~ #live2dcanvas { display: none !important; }

  .hintbar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: rgba(36,26,32,.94); border: 1px solid var(--line);
    border-radius: 20px; padding: 8px 18px; font-size: 12.5px;
    color: var(--dim); z-index: 40; backdrop-filter: blur(10px);
    transition: opacity .4s; white-space: nowrap;
  }
  .hintbar.hide { opacity: 0; pointer-events: none; }
  .hintbar b { color: var(--pink); font-weight: 500; }
</style>
</head>

<script>
const DATA = [{"book": "毛中特", "chapters": [{"name": "导论　马克思主义中国化时代化的历史进程与理论成果", "items": [{"p": "00-1-1　马克思主义中国化时代化的提出", "f": "★★★★☆", "t": "单选、多选、简答", "c": "\"马克思主义中国化\"这个命题不是天生的，是被教条主义打出来的。1938年党的六届六中全会上，毛泽东在《论新阶段》报告中正式提出，背景是1931年以来党内\"左\"倾错误把马克思主义教条化、把共产国际决议和苏联经验神圣化，让中国革命吃了大亏。"}, {"p": "00-1-2　马克思主义中国化时代化的内涵", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "内涵就是三层：用马克思主义解决中国问题、把中国经验上升为理论、用中国话讲马克思主义。毛泽东的原话是\"解决中国问题\"和\"创造些新的东西\"，这两句就是内涵的源头。"}, {"p": "00-1-3　马克思主义中国化时代化的历史进程", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "一条主线，三次飞跃。毛泽东思想是第一次历史性飞跃；改革开放以来形成中国特色社会主义理论体系，实现新的飞跃；党的十八大以来创立习近平新时代中国特色社会主义思想，实现新的飞跃。记住\"三次飞跃\"和每次飞跃对应的时代课题，这一考点就通了。"}, {"p": "00-1-4　马克思主义中国化时代化理论成果及其关系", "f": "★★★★☆", "t": "单选、多选、简答", "c": "五大成果：毛泽东思想、邓小平理论、\"三个代表\"重要思想、科学发展观、习近平新时代中国特色社会主义思想。关系八个字：一脉相承、与时俱进。承的是立场观点方法，进的是时代课题和理论内容。"}, {"p": "00-1-5　学习本课程的要求和方法", "f": "★☆☆☆☆", "t": "简答（低频）", "c": "考纲几乎不单独出题，但\"三个把握\"是万能答题框架，写作时套用很顺。"}]}, {"name": "第一章　毛泽东思想及其历史地位", "items": [{"p": "1-1-1　毛泽东思想形成发展的历史条件", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "两个条件：时代条件（帝国主义和无产阶级革命时代，战争与革命成为时代主题）+实践基础（中国共产党领导人民进行革命和建设的成功实践）。"}, {"p": "1-1-2　毛泽东思想形成发展的过程", "f": "★★★★★", "t": "单选、多选、简答", "c": "四阶段：萌芽（大革命时期）→初步形成（土地革命战争时期）→成熟（遵义会议后至抗日战争时期）→继续发展（解放战争时期和新中国成立后）。每阶段认准一个\"标志\"和几本\"著作\"。"}, {"p": "1-2-1　毛泽东思想的主要内容", "f": "★★★★☆", "t": "单选、多选、简答", "c": "六大理论：新民主主义革命理论、社会主义革命和社会主义建设理论、革命军队建设和军事战略的理论、政策和策略的理论、思想政治工作和文化工作的理论、党的建设理论。记\"革命—建设—军队—策略—文化—党建\"六字链。"}, {"p": "1-2-2　毛泽东思想活的灵魂", "f": "★★★★★", "t": "单选、多选、辨析、简答、论述、材料", "c": "三个基本方面：实事求是、群众路线、独立自主。这是贯穿毛泽东思想各个组成部分的立场、观点和方法，是本章最高频、最容易出大题的点。出处：1981年党的十一届六中全会《关于建国以来党的若干历史问题的决议》。"}, {"p": "1-3-1　马克思主义中国化时代化的第一个重大理论成果", "f": "★★★☆☆", "t": "单选、简答", "c": "三个身份、三个贡献：第一次历史性飞跃的理论成果；为中国特色社会主义理论体系奠定理论基础；确立了马克思主义中国化时代化的前进方向、基本原则和基本方法。"}, {"p": "1-3-2　中国革命和建设的科学指南", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "\"科学指南\"要落到三件实事上：找到新民主主义革命道路、找到向社会主义过渡的道路、为开创中国特色社会主义提供宝贵经验、理论准备、物质基础。三个\"伟大飞跃\"是标准表述。"}, {"p": "1-3-3　中国共产党和中国人民宝贵的精神财富", "f": "★★★★☆", "t": "单选、辨析、简答、材料", "c": "这一考点真正考的不是\"精神财富\"四个字，而是**如何科学评价毛泽东和毛泽东思想**。核心口径：功绩是第一位的，错误是第二位的；要把经过长期历史考验形成为科学理论的毛泽东思想，同毛泽东晚年所犯的错误区别开来。"}]}, {"name": "第二章　新民主主义革命理论", "items": [{"p": "2-1-1　近代中国国情和中国革命的时代特征", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "一个国情（半殖民地半封建社会）、一对主要矛盾（帝国主义与中华民族、封建主义与人民大众）、一个转变（旧民主主义革命转向新民主主义革命，以五四运动为标志）、一个两步走（先民主革命后社会主义革命）。"}, {"p": "2-1-2　新民主主义革命理论的实践基础", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "两层实践基础：旧民主主义革命的失败\"呼唤\"新理论；党领导新民主主义革命的艰辛探索\"奠定\"实践基础。理论来源于实践，四个\"没有…就没有\"是标准论证结构。"}, {"p": "2-2-1　新民主主义革命的总路线", "f": "★★★★★", "t": "单选、多选、辨析、简答、论述、材料", "c": "一句话总路线：无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。拆开就是五个要素：对象（三座大山）、动力（四个阶级）、领导（无产阶级）、性质（资产阶级民主革命）、前途（社会主义）。"}, {"p": "2-2-2　新民主主义的基本纲领", "f": "★★★★☆", "t": "单选、多选、简答", "c": "三大纲领：政治（各革命阶级联合专政的共和国）、经济（两没收一保护）、文化（民族的科学的大众的文化）。经济纲领里的\"两没收一保护\"是多选高频题。"}, {"p": "2-3-1　新民主主义革命的道路", "f": "★★★★★", "t": "单选、多选、简答、论述、材料", "c": "一条道路：农村包围城市、武装夺取政权。三个内容：土地革命（基本内容）、武装斗争（主要形式）、农村革命根据地（战略阵地）。两个\"为什么\"：为什么必须走（必然性）、为什么能走通（五个条件）。"}, {"p": "2-3-2　新民主主义革命的三大法宝", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "三个法宝：统一战线、武装斗争、党的建设。出处是《〈共产党人〉发刊词》。三者关系一句话：统一战线和武装斗争是两个基本武器，党的组织是掌握这两个武器的英勇战士。"}, {"p": "2-3-3　新民主主义革命理论的意义", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "四个层面：理论层面（揭示规律、回答向何处去）、马克思主义中国化层面（重要成果、开辟道路）、方法论层面（反对错误倾向、独立自主分析）、实践层面（建立新中国、改变世界格局）。"}]}, {"name": "第三章　社会主义改造理论", "items": [{"p": "3-1-1　新民主主义社会是一个过渡性的社会", "f": "★★★★☆", "t": "单选、多选、辨析、简答", "c": "一句话：新民主主义社会不是一个独立的社会形态，而是过渡性的社会形态，属于社会主义体系。五个经济成分、三种主要经济成分、两对矛盾、民族资产阶级两面性，是四个抓手。"}, {"p": "3-1-2　党在过渡时期的总路线及其依据", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "总路线=\"一化三改\"：逐步实现国家的社会主义工业化，逐步实现对农业、对手工业和对资本主义工商业的社会主义改造。\"一化\"是主体，\"三改\"是两翼。这是一条社会主义建设和社会主义改造同时并举的路线。"}, {"p": "3-2-1　适合中国特点的社会主义改造道路", "f": "★★★★★", "t": "单选、多选、简答、论述、材料", "c": "三条路：农业（互助合作，三步走）、手工业（供销入手，三步走）、资本主义工商业（和平赎买，三步走）。核心是三句：自愿互利、循序渐进、和平赎买。"}, {"p": "3-2-2　社会主义改造的历史经验", "f": "★★★★☆", "t": "多选、简答、论述", "c": "三条经验：同时并举、逐步过渡、和平方法。另加一条必须承认的\"失误与偏差\"，这是主观题拿高分的地方——只讲成绩不给反思，阅卷老师不会给满分。"}, {"p": "3-3-1　社会主义基本制度的确立及其理论根据", "f": "★★★★☆", "t": "单选、多选、简答", "c": "1956年底三大改造基本完成→经济结构根本变化→社会主义公有制成为经济基础→社会主义基本制度确立。理论根据的关键词是\"反对庸俗生产力论\"。"}, {"p": "3-3-2　确立社会主义基本制度的重大意义", "f": "★★★★☆", "t": "单选、多选、简答、材料", "c": "四个层次：制度基础（为当代中国一切发展进步奠定制度基础）、人民地位（劳动人民真正成为国家主人）、世界意义（占世界人口1/4的东方大国进入社会主义）、理论意义（丰富发展科学社会主义）。"}]}, {"name": "第四章　社会主义建设道路初步探索的理论成果", "items": [{"p": "4-1-1　调动一切积极因素为社会主义事业服务", "f": "★★★★☆", "t": "单选、多选、简答", "c": "一个方针（调动一切积极因素）、一个文件（《论十大关系》）、一个前提（坚持党的领导）、一个保障（发展社会主义民主政治）。"}, {"p": "4-1-2　正确认识和处理社会主义社会矛盾的思想", "f": "★★★★★", "t": "单选、多选、辨析、简答、论述、材料", "c": "一个总判断（矛盾普遍存在）、一对基本矛盾（生产力与生产关系、经济基础与上层建筑）、两类不同性质矛盾（敌我/人民内部）、两种解决方法（专政/民主）、一系列具体方针。文件出处：1957年2月《关于正确处理人民内部矛盾的问题》。"}, {"p": "4-1-3　走中国工业化道路的思想", "f": "★★★★☆", "t": "单选、多选、简答", "c": "一条道路（有别于苏联的中国工业化道路）、一个总方针（以农业为基础、以工业为主导、以农轻重为序）、一套\"两条腿走路\"、四个配套（建设方针、所有制结构、经济体制、企业管理）。"}, {"p": "4-1-4　初步探索的其他理论成果", "f": "★★★★☆", "t": "单选、多选", "c": "六块内容：社会主义发展阶段、\"四个现代化\"战略目标、科学教育文化和知识分子工作、国防建设、祖国统一、国际战略和外交工作、执政党建设。这一考点以单选、多选为主，重记忆、重对应。"}, {"p": "4-2-1　初步探索的意义", "f": "★★★☆☆", "t": "多选、简答", "c": "三条意义：巩固和发展了社会主义制度；为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础；丰富了科学社会主义的理论和实践。"}, {"p": "4-2-2　初步探索的经验教训", "f": "★★★★☆", "t": "多选、简答、论述", "c": "六条教训，每条都是\"必须+反面事实\"的结构：结合实际、抓住主要矛盾、不能急于求成、发展民主健全法制、坚持民主集中制、坚持对外开放。"}]}, {"name": "第五章　中国特色社会主义理论体系的形成发展", "items": [{"p": "5-1-1　中国特色社会主义理论体系形成发展的国际背景", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "一条主线：时代主题从\"战争与革命\"转为\"和平与发展\"。围绕这条主线，四代领导集体各自作出判断：邓小平判断时代主题转换、江泽民判断冷战后局势、胡锦涛应对金融危机、习近平把握百年未有之大变局。"}, {"p": "5-1-2　中国特色社会主义理论体系形成发展的历史条件", "f": "★★★★☆", "t": "单选、多选、简答", "c": "三个\"对\"：对历史经验的深刻总结、对历史方位的科学判断、对历史任务的准确把握。落到史实上就是一条线：从\"以苏为鉴\"的探索，到\"文革\"的教训，到十一届三中全会的纠正，再到新时代的方位判断。"}, {"p": "5-1-3　中国特色社会主义理论体系形成发展的实践基础", "f": "★★★★☆", "t": "单选、多选、简答、材料", "c": "一句话：理论是从实践里长出来的，遵循\"实践、认识、再实践、再认识\"的规律。四个时期各有标志性实践：小岗村（农村改革）、抗风险（十三届四中全会后）、入世与科学发展（十六大后）、新时代变革（十八大以来）。"}, {"p": "5-2-1　中国特色社会主义理论体系的形成", "f": "★★★★★", "t": "单选、多选、简答", "c": "一条时间轴：真理标准讨论→十一届三中全会→十二大命题→十三大轮廓→南方谈话成熟→十四大体系化→十五大定名写入党章。定位：邓小平理论是中国特色社会主义理论体系的**开篇之作**。"}, {"p": "5-2-2　中国特色社会主义理论体系的跨世纪发展", "f": "★★★★☆", "t": "单选、多选、简答", "c": "\"三个代表\"重要思想=跨世纪发展。核心是三句话（代表先进生产力的发展要求、先进文化的前进方向、最广大人民的根本利益），关键是回答\"建设什么样的党、怎样建设党\"。"}, {"p": "5-2-3　中国特色社会主义理论体系在新世纪新阶段的新发展", "f": "★★★★☆", "t": "单选、多选、简答", "c": "科学发展观=新世纪新阶段的新发展。起点是非典（2003），标志形成是2004年3月中央人口资源环境座谈会，写入党章是十七大，确立为指导思想是十八大。核心四句：第一要义是发展、核心是以人为本、基本要求是全面协调可持续、根本方法是统筹兼顾。"}, {"p": "5-2-4　中国特色社会主义理论体系在新时代的新篇章", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "习思想=新时代新篇章。记三组数字：\"十个明确\"\"十四个坚持\"\"十三个方面成就\"；记两个时间：2017十九大写入党章、2018载入宪法；记五个定位。"}]}, {"name": "第六章　邓小平理论", "items": [{"p": "6-1-1　邓小平理论首要的基本的理论问题", "f": "★★★★★", "t": "单选、多选、辨析、简答、论述", "c": "首要的基本的理论问题是\"什么是社会主义、怎样建设社会主义\"。回答它的关键，是在坚持社会主义基本制度的基础上认清社会主义本质。1992年南方谈话的五句话，就是标准答案。"}, {"p": "6-1-2　邓小平理论的精髓", "f": "★★★★★", "t": "单选、多选、辨析、简答", "c": "精髓是解放思想、实事求是。二者的关系是一句话：只有解放思想才能达到实事求是，只有实事求是才是真正的解放思想。"}, {"p": "6-2-1　社会主义初级阶段理论和党的基本路线", "f": "★★★★★", "t": "单选、多选、辨析、简答、论述", "c": "一个判断（我国正处于并将长期处于社会主义初级阶段）、两层含义（已经是社会主义+还处在初级阶段）、一条路线（一个中心、两个基本点）。"}, {"p": "6-2-2　社会主义根本任务和发展战略理论", "f": "★★★★☆", "t": "单选、多选、简答", "c": "一个根本任务（发展生产力）、一句名言（发展才是硬道理）、一个第一（科学技术是第一生产力）、一个战略（三步走）。"}, {"p": "6-2-3　社会主义改革开放和社会主义市场经济理论", "f": "★★★★★", "t": "单选、多选、辨析、简答、论述", "c": "两块内容：改革（第二次革命+三个有利于+对外开放基本国策）、市场经济（四次理论突破，1992南方谈话定型）。"}, {"p": "6-2-4　\"两手抓，两手都要硬\"", "f": "★★★★☆", "t": "单选、多选、辨析、简答", "c": "三个版本的两手抓：物质文明+精神文明（主版本）、建设+法制、改革开放+惩治腐败。方法论是两点论和重点论的统一。"}, {"p": "6-2-5　\"一国两制\"与祖国统一", "f": "★★★★★", "t": "单选、多选、辨析、简答、论述", "c": "五条基本内容：一个中国（核心）、两制并存、高度自治、尽最大努力争取和平统一但不承诺放弃使用武力、寄希望于台湾人民。"}, {"p": "6-2-6　中国特色社会主义外交和国际战略", "f": "★★★★☆", "t": "单选、多选、简答", "c": "一个判断（和平与发展是两大主题，东西南北四个字）、一个目标（维护独立主权、促进和平发展）、五项原则（和平共处）、四项党际原则、七句话方针（冷静观察……决不当头）。"}, {"p": "6-3-1　马克思列宁主义、毛泽东思想的继承和发展", "f": "★★★★☆", "t": "单选、多选、简答", "c": "三个\"是\"：是马克思列宁主义基本原理同当代中国实际和时代特征相结合的产物；是对马克思列宁主义、毛泽东思想的继承和发展；是全党全国人民集体智慧的结晶。关键在\"既继承前人又突破陈规\"。"}, {"p": "6-3-2　中国特色社会主义理论体系的开篇之作", "f": "★★★★★", "t": "单选、多选、简答", "c": "\"开篇之作\"落在三件事上：确立了主题（中国特色社会主义）、搭起了框架（一系列新概念新范畴）、形成了体系（第一次比较系统的回答）。"}, {"p": "6-3-3　改革开放和社会主义现代化建设的科学指南", "f": "★★★★☆", "t": "单选、多选、简答", "c": "\"科学指南\"要落到七个方面的具体指导上，再落到实践检验的结论上：经过改革开放和现代化建设实践的检验，是系统的科学理论。"}]}, {"name": "第七章　\"三个代表\"重要思想", "items": [{"p": "7-1-1　始终代表中国先进生产力的发展要求", "f": "★★★★★", "t": "单选、多选、简答", "c": "\"代表中国先进生产力的发展要求\"，就是党的理论、路线、纲领、方针、政策和各项工作，必须努力符合生产力发展的规律，体现不断推动社会生产力的解放和发展的要求，尤其要体现推动先进生产力发展的要求，通过发展生产力不断提高人民群众的生活水平。"}, {"p": "7-1-2　始终代表中国先进文化的前进方向", "f": "★★★★★", "t": "单选、多选、简答", "c": "\"代表中国先进文化的前进方向\"，就是党的理论、路线、纲领、方针、政策和各项工作，必须努力体现发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化的要求，促进全民族思想道德素质和科学文化素质的不断提高，为我国经济发展和社会进步"}, {"p": "7-1-3　始终代表中国最广大人民的根本利益", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "\"代表中国最广大人民的根本利益\"，就是党的理论、路线、纲领、方针、政策和各项工作，必须坚持把人民的根本利益作为出发点和归宿，充分发挥人民群众的积极性主动性创造性，在社会不断发展进步的基础上，使人民群众不断获得切实的经济、政治、文化利益。"}, {"p": "7-2-1　发展是党执政兴国的第一要务", "f": "★★★★★", "t": "单选、多选、简答", "c": "党要承担起推动中国社会进步的历史责任，必须始终紧紧抓住发展这个执政兴国的第一要务，把坚持党的先进性和发挥社会主义制度的优越性，落实到发展先进生产力、发展先进文化、实现最广大人民的根本利益上来，推动社会全面进步，促进人的全面发展。"}, {"p": "7-2-2　建立社会主义市场经济体制", "f": "★★★★★", "t": "单选、多选、简答", "c": "在社会主义条件下发展市场经济，是改革开放新的历史性突破，是前无古人的伟大创举，是中国共产党人对马克思主义发展作出的历史性贡献。社会主义市场经济是同社会主义基本制度结合在一起的，既可以发挥市场经济的长处，又可以发挥社会主义制度的优越性。"}, {"p": "7-2-3　全面建设小康社会", "f": "★★★★☆", "t": "单选、多选、简答", "c": "党的十六大深刻阐述了全面建设小康社会的奋斗目标：我们要在本世纪头二十年，集中力量，全面建设惠及十几亿人口的更高水平的小康社会，使经济更加发展、民主更加健全、科教更加进步、文化更加繁荣、社会更加和谐、人民生活更加殷实。"}, {"p": "7-2-4　建设社会主义政治文明", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "建设社会主义政治文明与物质文明、精神文明一起确立为社会主义现代化全面发展的**三大基本目标**。建设社会主义政治文明，最根本的就是要坚持**党的领导、人民当家作主和依法治国的有机统一**。"}, {"p": "7-2-5　实施\"引进来\"和\"走出去\"相结合的对外开放战略", "f": "★★★★☆", "t": "单选、多选、简答", "c": "对外开放是一项长期的基本国策。进入20世纪90年代，适应经济全球化趋势的发展和加入世界贸易组织的新形势，我国以更加积极的姿态走向世界，坚持\"引进来\"和\"走出去\"相结合，全面提高对外开放水平，在更大范围、更广领域和更高层次上参与国际经济技术合"}, {"p": "7-2-6　推进党的建设新的伟大工程", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "办好中国的事情，关键取决于我们党。江泽民紧紧围绕**建设什么样的党、怎样建设党**，进行了长期深入的思考，强调要以改革的精神研究和解决党的建设面临的重大理论和现实问题，使党始终保持先进性和纯洁性，充满创造力、凝聚力和战斗力，推进党的建设新的"}, {"p": "7-3-1　中国特色社会主义理论体系的丰富发展", "f": "★★★★☆", "t": "单选、多选、简答", "c": "\"三个代表\"重要思想以新的思想、观点、论断，继承、丰富和发展了马克思列宁主义、毛泽东思想、邓小平理论，实现了党在指导思想上的**又一次与时俱进**，是中国特色社会主义理论体系的重要组成部分。"}, {"p": "7-3-2　加强和改进党的建设、推进中国特色社会主义事业的", "f": "★★★★☆", "t": "单选、多选、简答、论述", "c": "\"三个代表\"重要思想在邓小平理论的基础上，进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性地回答了建设什么样的党、怎样建设党的问题，进一步深化了对中国特色社会主义的认识。它是加强和改进党的建设、推进我国社会主义自我完善和发展的**"}]}, {"name": "第八章　科学发展观", "items": [{"p": "8-1-1　推动经济社会发展是科学发展观的第一要义", "f": "★★★★★", "t": "单选、多选、简答", "c": "发展是人类文明进步的基础，也是马克思主义最基本的范畴之一。我们党执政，首要任务就是带领人民推动经济社会发展。在当代中国，坚持发展是硬道理的本质要求就是坚持科学发展。"}, {"p": "8-1-2　以人为本是科学发展观的核心立场", "f": "★★★★★", "t": "单选、多选、辨析、简答、论述", "c": "以人为本是科学发展观的核心立场，集中体现了马克思主义的基本原理，体现了我们党全心全意为人民服务的根本宗旨和推动经济社会发展的根本目的，是社会主义的本质特征。"}, {"p": "8-1-3　全面协调可持续是科学发展观的基本要求", "f": "★★★★★", "t": "单选、多选、简答", "c": "全面协调可持续是科学发展观的基本要求。其中\"全面\"指发展要有全面性、整体性；\"协调\"指发展要有协调性、均衡性；\"可持续\"指发展要有持久性、连续性。"}, {"p": "8-1-4　统筹兼顾是科学发展观的根本方法", "f": "★★★★★", "t": "单选、多选、简答", "c": "统筹兼顾是科学发展观的根本方法，深刻体现了唯物辩证法在发展问题上的科学运用，深刻揭示了实现科学发展、促进社会和谐的基本途径，是正确处理经济社会发展中重大关系的方针原则。"}, {"p": "8-2-1　加快转变经济发展方式", "f": "★★★★★", "t": "单选、多选、简答", "c": "推动经济持续健康发展，必须坚持以科学发展为主题，以加快转变经济发展方式为主线。这是关系我国发展全局的战略抉择，是赢得未来竞争主动权的必然要求。"}, {"p": "8-2-2　发展社会主义民主政治", "f": "★★★★☆", "t": "单选、多选、简答", "c": "人民民主是社会主义的生命，是我们党始终高扬的光辉旗帜。社会主义愈发展，民主也愈发展。社会主义民主政治的本质和核心是**人民当家作主**。"}, {"p": "8-2-3　推进社会主义文化强国建设", "f": "★★★★☆", "t": "单选、多选、简答", "c": "建设社会主义文化强国，是我们党把握时代和形势发展变化，积极回应各族人民精神文化需求作出的重大战略决策。文化是民族的血脉，是人民的精神家园。"}, {"p": "8-2-4　构建社会主义和谐社会", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "社会和谐是中国特色社会主义的**本质属性**。科学发展和社会和谐是内在统一的：没有科学发展就没有社会和谐，没有社会和谐也难以实现科学发展。"}, {"p": "8-2-5　推进生态文明建设", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "建设生态文明，是关系人民福祉、关乎民族未来的长远大计。必须树立尊重自然、顺应自然、保护自然的生态文明理念，把生态文明建设放在突出地位，融入经济建设、政治建设、文化建设、社会建设各方面和全过程，努力建设**美丽中国**，实现中华民族永续发展。"}, {"p": "8-2-6　全面提高党的建设科学化水平", "f": "★★★★☆", "t": "单选、多选、简答", "c": "党的建设是党领导的伟大事业不断取得胜利的重要法宝。形势的发展、事业的开拓、人民的期待，都要求我们以改革创新精神全面推进党的建设新的伟大工程，全面提高党的建设科学化水平。"}, {"p": "8-3-1　中国特色社会主义理论体系在新世纪新阶段的接续发展", "f": "★★★★★", "t": "单选、多选、简答", "c": "科学发展观是马克思主义关于发展的世界观和方法论的集中体现，是中国特色社会主义理论体系的重要组成部分，是中国特色社会主义理论体系在新世纪新阶段的**接续发展**。"}, {"p": "8-3-2　全面建设小康社会、加快推进社会主义现代化的根本指针", "f": "★★★★☆", "t": "单选、多选、简答", "c": "科学发展观涉及生产力和生产关系、经济基础和上层建筑的各个环节，贯通中国特色社会主义伟大事业和党的建设新的伟大工程的各个方面，进一步深化了对共产党执政规律、社会主义建设规律和人类社会发展规律的认识，是我们党执政理念的丰富和发展，是全面建设小康"}]}]}, {"book": "习概", "chapters": [{"name": "第00章　导论", "items": [{"p": "00-1-1　习近平新时代中国特色社会主义思想创立的时代背景", "f": "★★★★★", "t": "单选、多选、简答", "c": "时代是思想之母，实践是理论之源。这一思想不是凭空产生的，而是在世界百年未有之大变局、中华民族伟大复兴关键时期、中国式现代化全面推进拓展、科学社会主义在21世纪的中国焕发新生机、中国共产党自我革命开辟新境界这五个时代的交汇点上创立并不断丰富发"}, {"p": "00-1-2　习近平新时代中国特色社会主义思想是“两个结合”的重大成果", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持\"两个结合\"的光辉典范。\"两个结合\"是我们党在探索中国特色社会主义道路中得出的规律性认识，是我们取得成功的最大法宝。讲清这个考点，要回答三层：为什么"}, {"p": "00-1-3　习近平新时代中国特色社会主义思想是完整的科学体系", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一思想从理论和实践的结合上科学回答了三大时代课题，以\"十个明确\"\"十四个坚持\"\"十三个方面成就\"\"六个必须坚持\"为主要内容，四者内在贯通、有机统一，共同构成逻辑严密、内涵丰富、系统全面、博大精深的科学体系。本考点是全章最容易出多选题的地方"}, {"p": "00-1-4　习近平新时代中国特色社会主义思想的历史地位", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "历史地位可以用一句话锁定：这一思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。前两句是定性，后一句是定位；定性回答\"它是什么样的理论\"，定位回答\"它在马克思主义发展史上处"}, {"p": "00-1-5　深刻领悟“两个确立”的决定性意义", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "\"两个确立\"，即确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。它是党在新时代取得的重大政治成果，对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。逻辑很硬：坚强的领导核心和"}, {"p": "00-1-6　学好用好习近平新时代中国特色社会主义思想", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "学习贯彻这一思想，是全党全国的根本政治任务，也是广大青年大学生成为担当民族复兴大任时代新人的必然要求。课程目的是\"掌握内容体系—把握立场观点方法—增进四个认同—做到学思用贯通、知信行统一\"，落点在三个下功夫：坚定理想信念、提高理论水平、增强"}]}, {"name": "第01章　新时代坚持和发展中国特色社会主义", "items": [{"p": "1-1-1　中国特色社会主义是历史和人民的选择", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "道路问题是关系党的事业兴衰成败第一位的问题。中国特色社会主义不是从天上掉下来的，是党和人民历经千辛万苦、付出巨大代价取得的根本成就，是近代以来中国社会发展的必然选择，是历史和人民的选择。论证这条道路为什么\"选得对\"，靠的是历史线索加\"六个得"}, {"p": "1-1-2　中国特色社会主义是社会主义而不是其他什么主义", "f": "★★★★★", "t": "单选、多选、辨析、简答", "c": "这一考点回答的是\"姓社\"问题：中国特色社会主义是科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一，既坚持了科学社会主义基本原则，又根据时代条件赋予其鲜明的中国特色。判断标准只有一条——有没有丢掉科学社会主义基本原则。"}, {"p": "1-1-3　坚定道路自信、理论自信、制度自信、文化自信", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是开辟了中国特色社会主义道路、形成了中国特色社会主义理论体系、确立了中国特色社会主义制度、发展了中国特色社会主义文化。\"四个自信\"就建立在这四者之上，来源于实践、来源于人民、来源于真理"}, {"p": "1-2-1　中国特色社会主义新时代是我国发展新的历史方位", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "新时代是我国发展新的历史方位，标志着中国特色社会主义事业进入了新的发展阶段。把握这个考点要抓住\"五个是\"\"三个意味着\"\"三个反映\"：\"五个是\"讲新时代是什么，\"三个意味着\"讲它意味着什么，\"三个反映\"讲它凭什么作出这个判断。"}, {"p": "1-2-2　社会主要矛盾变化是关系全局的历史性变化", "f": "★★★★★", "t": "单选、多选、辨析、简答", "c": "新时代我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。这一变化是关系全局的历史性变化，但它是在社会主义初级阶段中发生的变化，没有改变对我国社会主义所处历史阶段的判断——\"变\"的是主要矛盾，\"没有变\"的是基"}, {"p": "1-2-3　新时代伟大变革及其里程碑意义", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "新时代伟大变革的讲法有固定套路：先摆十八大前的问题清单，再讲采取的举措，然后列突破性进展，最后落在\"五个史\"的里程碑意义。核心一句是\"解决了许多长期想解决而没有解决的难题，办成了许多过去想办而没有办成的大事\"。"}, {"p": "1-3-1　全面贯彻党的基本理论、基本路线、基本方略", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "党的基本理论、基本路线、基本方略，事关党的前途命运，事关中国特色社会主义事业兴衰成败。三者是\"指南—生命线—方略\"的关系：基本理论是行动指南，基本路线是国家的生命线、人民的幸福线，基本方略是\"十四个坚持\"。历史和现实充分证明，三者是完全正确"}, {"p": "1-3-2　统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "\"五位一体\"总体布局和\"四个全面\"战略布局相互促进、统筹联动，从全局上确立了新时代坚持和发展中国特色社会主义的战略规划和部署。一个管\"布局什么\"，一个管\"靠什么推进\"；总体布局的演进史是\"两个文明→三位一体→四位一体→五位一体\"，战略布局的"}, {"p": "1-3-3　推动中国特色社会主义不断开拓前进", "f": "★★★★☆", "t": "单选、多选、简答、论述", "c": "社会主义是前无古人的伟大事业，没有现成方案可以遵循，必须随着时代、实践和科学的发展不断探索前进。这个考点讲三件事：一代代接续奋斗把\"大文章\"写下去；社会主义发展道路从来不是笔直的，要靠顽强斗争；历史只会眷顾坚定者、奋进者、搏击者。"}]}, {"name": "第2章　以中国式现代化全面推进中华民族伟大复兴", "items": [{"p": "2-1-1　实现中华民族伟大复兴的中国梦", "f": "★★★★★", "t": "单选、多选、简答", "c": "中国梦是习近平2012年11月参观《复兴之路》展览时首次提出的重大命题，其内涵是实现中华民族伟大复兴；本质是国家富强、民族振兴、人民幸福。中国梦把国家、民族、个人三个层面的追求统一起来，是激励中华儿女团结奋进的精神旗帜。"}, {"p": "2-1-2　在中华大地上全面建成小康社会", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "全面建成小康社会是实现中华民族伟大复兴中国梦的关键一步，是我国社会主义现代化进程中的一座重要里程碑。2021年7月1日，习近平在庆祝中国共产党成立100周年大会上庄严宣告，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题。"}, {"p": "2-1-3　全面建成社会主义现代化强国", "f": "★★★★★", "t": "单选、多选、简答", "c": "党的十九大作出从全面建成小康社会到基本实现社会主义现代化、再到全面建成社会主义现代化强国的战略安排；党的二十大进一步明确，总的战略安排是分两步走：从2020年到2035年基本实现社会主义现代化；从2035年到本世纪中叶把我国建成富强民主文明"}, {"p": "2-2-1　中国式现代化是党领导人民长期探索和实践的重大成果", "f": "★★★★☆", "t": "单选、多选、简答", "c": "中国共产党团结带领中国人民追求民族复兴的历史，也是一部不断探索现代化道路的历史。中国式现代化是在新中国成立特别是改革开放以来长期探索和实践基础上，经过党的十八大以来在理论和实践上的创新突破，成功推进和拓展的。实践证明，中国式现代化走得通、行"}, {"p": "2-2-2　中国式现代化的中国特色", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "习近平指出：\"中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。\"党的二十大集中概括了中国式现代化五个方面的中国特色，深刻揭示了中国式现代化的科学内涵，这是理论概括，也是实践要求。"}, {"p": "2-2-3　中国式现代化的本质要求", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "中国式现代化的本质要求共九条：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。其中\"坚持中国共产党领导\""}, {"p": "2-2-4　中国式现代化创造了人类文明新形态", "f": "★★★★☆", "t": "单选、多选、简答、论述", "c": "中国式现代化深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，是一种全新的人类文明形态。它打破了\"现代化＝西方化\"的迷思，为发展中国家提供了全新选择。"}, {"p": "2-3-1　推进中国式现代化需要牢牢把握的重大原则", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "以中国式现代化全面推进中华民族伟大复兴是一次新的长征，前途光明，任重道远。前进道路上必须牢牢把握五条重大原则：坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。"}, {"p": "2-3-2　推进中国式现代化需要正确处理的重大关系", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "推进中国式现代化，需要统筹兼顾、系统谋划、整体推进，正确处理六个方面的重大关系：顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放。"}, {"p": "2-3-3　推进中国式现代化必须坚持团结奋斗", "f": "★★★★☆", "t": "单选、多选、简答", "c": "团结就是力量，奋斗开创未来。团结奋斗是中国共产党和中国人民最显著的精神标识，是中国人民创造历史伟业的必由之路。推进中国式现代化，必须大力弘扬团结奋斗精神。"}]}, {"name": "第3章　坚持党的全面领导", "items": [{"p": "3-1-1　中国最大的国情就是中国共产党的领导", "f": "★★★★★", "t": "单选、多选、简答", "c": "中国特色社会主义有很多特点和特征，其中最本质的特征是中国共产党领导。这个最本质特征是在近代以来中国历史发展中形成的，是由中国最广大人民根本利益和实现中华民族伟大复兴历史任务决定的。习近平指出：\"中国最大的国情就是中国共产党的领导。什么是中国"}, {"p": "3-1-2　中国共产党领导是中国特色社会主义制度的最大优势", "f": "★★★★★", "t": "单选、多选、简答", "c": "我国国家制度和国家治理体系具有多方面的显著优势，其中最大优势是中国共产党领导。这一优势是带有统领性的根本优势，贯穿于中国特色社会主义制度和国家治理体系其他方面显著优势中。"}, {"p": "3-1-3　加强党的全面领导为新时代党和国家事业发展提供了坚强保证", "f": "★★★★☆", "t": "单选、多选、简答", "c": "党的十八大以来，以习近平同志为核心的党中央坚持和加强党的全面领导，全党全国各族人民对坚持党的领导的认识不断深化，党的领导制度体系更加健全，党在应对各种风险挑战中发挥了中流砥柱的作用，为党和国家事业取得历史性成就、发生历史性变革提供了根本保证"}, {"p": "3-2-1　中国共产党是最高政治领导力量", "f": "★★★★★", "t": "单选、多选、简答", "c": "习近平明确指出：\"在当今中国，没有大于中国共产党的政治力量或其他什么力量。党政军民学，东西南北中，党是领导一切的，是最高的政治领导力量。\"这一论断深刻阐明了中国共产党在国家政治生活中的领导核心地位。"}, {"p": "3-2-2　党的领导是全面的、系统的、整体的", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "中国共产党作为最高政治领导力量，在党和国家事业发展中居于中心地位。党的领导是全面的、系统的、整体的，必须贯穿到治国理政的方方面面。习近平指出：\"哪个领域、哪个方面、哪个环节缺失了弱化了，都会削弱党的力量，损害党和国家事业。\""}, {"p": "3-2-3　维护党中央权威和集中统一领导", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "事在四方，要在中央。党中央集中统一领导是党的领导的最高原则，是党保持团结统一和强大战斗力、不断取得胜利的关键所在。加强和维护党中央权威和集中统一领导，是全党共同的政治责任，是党和国家事业发展的必然要求。"}, {"p": "3-3-1　党的领导制度是我国的根本领导制度", "f": "★★★★★", "t": "单选、多选、简答", "c": "坚持党的全面领导，必须依靠制度来保障。党的领导制度是我国的根本领导制度。习近平指出：\"中国特色社会主义制度是一个严密完整的科学制度体系，起四梁八柱作用的是根本制度、基本制度、重要制度，其中具有统领地位的是党的领导制度。\""}, {"p": "3-3-2　健全党中央对重大工作的领导体制", "f": "★★★★☆", "t": "单选、多选、简答", "c": "党中央对重大工作的领导体制，是加强党的全面领导的制度安排，是实现党的全面领导的直接体现。加强党的全面领导，必须加强党中央对党和国家重大工作的领导。"}, {"p": "3-3-3　健全党的全面领导制度", "f": "★★★★☆", "t": "单选、多选、简答", "c": "坚持和加强党的全面领导，必须健全党的全面领导制度，发挥党在各种组织中总揽全局、协调各方的领导核心作用，把党的领导贯彻到党和国家所有机构履行职责全过程。"}]}, {"name": "第4章　坚持以人民为中心", "items": [{"p": "4-1-1　人民是历史的创造者，是真正的英雄", "f": "★★★★★", "t": "单选、多选、简答", "c": "人民是创造历史的真正动力，是历史发展和社会进步的主体力量。坚持以人民为中心，体现了历史唯物主义基本原理，是我们党总结历史经验、把握历史规律得出的重要结论。这一考点是整章的哲学基石，回答\"为什么必须站在人民一边\"。"}, {"p": "4-1-2　打江山、守江山，守的是人民的心", "f": "★★★★★", "t": "单选、多选、辨析、简答", "c": "民心是最大的政治，决定事业兴衰成败。党为人民夺取政权打江山，又为人民巩固政权守江山，守的正是人民的心。这一考点从国家政权性质和党的性质宗旨两个角度，论证\"江山就是人民，人民就是江山\"何以成立。"}, {"p": "4-1-3　人民立场是中国共产党的根本政治立场", "f": "★★★★★", "t": "单选、多选、简答", "c": "政治立场是一个政党观察、认识、处理政治问题的立足点。人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一立场，就要把以人民为中心的执政理念贯穿于党和国家事业发展各方面，具体展开为牢记初心使命、保持血肉联系、热爱尊重"}, {"p": "4-2-1　人民对美好生活的向往就是党的奋斗目标", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "坚持人民至上，是我们党百年奋斗的宝贵历史经验，也是新时代党治国理政的根本价值取向。其中最基础的一条，是把人民对美好生活的向往作为党的奋斗目标。这一命题既是初心使然，又体现我国社会主要矛盾转化对党和国家工作的新要求。"}, {"p": "4-2-2　依靠人民创造历史伟业", "f": "★★★★☆", "t": "单选、多选、简答", "c": "人民是我们党的生命之根、执政之基、力量之源。党靠人民赢得胜利，也要靠人民开创未来。依靠人民创造历史伟业，具体落实为两条：尊重人民主体地位、尊重人民首创精神。"}, {"p": "4-2-3　人民是党的工作的最高裁决者和最终评判者", "f": "★★★★★", "t": "单选、多选、辨析、材料", "c": "党的执政水平和执政成效不是由自己说了算，必须而且只能由人民来评判。人民是党的工作的最高裁决者和最终评判者，检验标准是人民是否真正得到实惠、生活是否真正得到改善、权益是否真正得到保障。由此引出树立和践行正确政绩观的要求。"}, {"p": "4-3-1　坚持和贯彻党的群众路线", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "群众路线是党的生命线和根本工作路线，是党永葆青春活力和战斗力的重要传家宝。贯彻群众路线要把\"知\"与\"行\"统一起来，而调查研究是获得真知灼见的源头活水，是贯彻群众路线的有效途径。"}, {"p": "4-3-2　把为人民造福的事情真正办好办实", "f": "★★★★☆", "t": "单选、多选、简答", "c": "坚持以人民为中心的发展思想不是一句空洞口号，不能只停留在口头上、止步于思想环节，而要落实到党和国家的各项事业中，体现到人民群众的切身感受上。办好办实，靠三条：落到各领域、抓住最关心最直接最现实的利益问题、一件接着一件办并靠制度保障。"}, {"p": "4-3-3　推动全体人民共同富裕取得更为明显的实质性进展", "f": "★★★★★", "t": "单选、多选、辨析、论述", "c": "共同富裕是中国特色社会主义的本质要求，是中国式现代化的重要特征。它不仅是经济问题，而且是关系党的执政基础的重大政治问题。推进共同富裕要把握四原则、遵循一个总思路，并与促进人的全面发展高度统一。"}]}, {"name": "第5章　全面深化改革开放", "items": [{"p": "5-1-1　改革开放是我们前进的重要法宝", "f": "★★★★★", "t": "单选、多选、简答", "c": "改革开放是党和人民大踏步赶上时代的重要法宝，是坚持和发展中国特色社会主义的必由之路，也是完成新时代目标任务的必然要求。中国要前进，就要全面深化改革开放；除了全面深化改革开放，别无他途。"}, {"p": "5-1-2　新时代全面深化改革开放是一场深刻革命", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "新时代全面深化改革开放，就其艰巨性、复杂性和系统性来说，是一场深刻的革命。它是涉险滩、闯难关的变革，是全面、系统、整体的制度创新，其成就具有历史性、革命性、开创性。"}, {"p": "5-1-3　坚持全面深化改革开放的正确方向", "f": "★★★★★", "t": "单选、多选、辨析、简答", "c": "全面深化改革开放改什么、怎么改，是一个带有根本性的问题。我们的改革开放是有方向、有立场、有原则的，必须保持战略定力，确保改革不改向、变革不变色。方向由三条构成：党的领导和中国特色社会主义制度、以人民为中心、\"三个进一步解放\"。"}, {"p": "5-2-1　坚持全面深化改革总目标", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "全面深化改革总目标是：完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。两句话是一个有机整体，前者规定根本方向，后者明确鲜明指向和时代要求，两句话都讲才是完整的、全面的。总目标通过\"六个紧紧围绕\"的路线图展开为各领域分目标。"}, {"p": "5-2-2　推进国家治理体系和治理能力现代化", "f": "★★★★★", "t": "单选、多选、辨析、简答", "c": "国家治理体系和治理能力是一个国家制度和制度执行能力的集中体现，二者相辅相成、有机统一。推进现代化要抓好三件事：坚定制度自信、更好发挥制度优势、把制度优势转化为国家治理效能。"}, {"p": "5-2-3　全面深化改革开放要坚持正确方法论", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "全面深化改革开放是一个复杂系统工程，正确的方法对于改革顺利推进、取得成功至关重要。方法论共五条：增强系统性整体性协同性、顶层设计与摸着石头过河相结合、统筹改革发展稳定、胆子要大步子要稳、重大改革于法有据。"}, {"p": "5-3-1　改革开放永无止境", "f": "★★★★☆", "t": "单选、多选、辨析、简答", "c": "改革开放只有进行时，没有完成时，停顿和倒退没有出路。这一判断有三重依据：社会基本矛盾运动规律的深刻反映、总结世界社会主义实践经验得出的重要结论、推进党和人民事业发展的必然要求。"}, {"p": "5-3-2　坚定不移把全面深化改革引向深入", "f": "★★★★☆", "t": "单选、多选、简答、材料", "c": "新时代全面深化改革取得巨大成就，但仍需持续推进。新征程上根本动力仍然是改革开放，要继续用足用好这个关键一招，聚焦全面建设社会主义现代化国家中的重大问题，抓好重大改革任务攻坚克难。改革推进到今天，比认识更重要的是决心，比方法更关键的是担当。"}, {"p": "5-3-3　坚定不移扩大高水平对外开放", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "开放也是改革。以开放促改革、促发展是我国发展不断取得新成就的宝贵经验。经济全球化的历史大势不可逆转，中国开放的大门只会越开越大，永远不会关上。要构建更高水平开放型经济新体制，稳步扩大制度型开放。"}]}, {"name": "第六章　推动高质量发展", "items": [{"p": "6-1-1　我国进入新发展阶段", "f": "★★★★★", "t": "单选、多选、简答", "c": "新发展阶段是我国发展的历史方位判断。我国经济已由高速增长阶段转向高质量发展阶段，这是新时代谋划一切经济工作的出发点。正确认识历史方位和发展阶段，是党明确各个阶段中心任务、制定正确路线方针政策的根本依据。"}, {"p": "6-1-2　贯彻新发展理念是关系我国发展全局的一场深刻变革", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "新发展理念是创新、协调、绿色、开放、共享，是管全局、管根本、管方向、管长远的东西，是实现高质量发展的指导原则。贯彻新发展理念是关系我国发展全局的一场深刻变革，是新时代我国发展壮大的必由之路。"}, {"p": "6-1-3　以新发展理念引领高质量发展", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "高质量发展是全面建设社会主义现代化国家的首要任务，是遵循经济规律发展的必然要求。高质量发展就是体现新发展理念的发展，就是从\"有没有\"转向\"好不好\"。"}, {"p": "6-2-1　坚持和完善社会主义基本经济制度是实现高质量发展的保障", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "社会主义基本经济制度是中国特色社会主义制度的重要支柱，是新时代推动实现高质量发展的制度基础。它的新概括由三大支柱构成：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。"}, {"p": "6-2-2　坚持\"两个毫不动摇\"", "f": "★★★★★", "t": "单选、多选、辨析、简答", "c": "公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础。必须毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展。"}, {"p": "6-2-3　坚持按劳分配为主体、多种分配方式并存", "f": "★★★★☆", "t": "单选、多选、简答", "c": "按劳分配为主体、多种分配方式并存是我国的基本分配制度。它由我国社会主义性质和基本国情决定，是社会主义基本经济制度的三大支柱之一，有利于调动各方面积极性、实现效率和公平有机统一。"}, {"p": "6-2-4　构建高水平社会主义市场经济体制", "f": "★★★★★", "t": "单选、多选、简答", "c": "构建高水平社会主义市场经济体制，关键是要处理好政府和市场的关系。核心表述是：使市场在资源配置中起决定性作用，更好发挥政府作用，推动有效市场和有为政府更好结合。"}, {"p": "6-3-1　把握未来发展主动权的战略部署", "f": "★★★★★", "t": "单选、多选、辨析、简答", "c": "构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，是根据我国发展阶段、发展环境、条件变化，特别是基于我国比较优势变化，审时度势作出的重大决策，是推动高质量发展的战略基点，是关系我国发展全局的重大战略任务。"}, {"p": "6-3-2　以国内大循环为主体、国内国际双循环相互促进", "f": "★★★★☆", "t": "单选、多选、简答", "c": "构建新发展格局涉及我国经济发展的各个方面、各个领域，必须准确把握基本要求，加强整体协调和系统布局，推动国内循环和国际循环相互促进、良性互动。"}, {"p": "6-3-3　大力推动构建新发展格局", "f": "★★★★☆", "t": "单选、多选、简答", "c": "全面建成新发展格局任重道远，必须坚持问题导向和系统观念，着力破除制约加快构建新发展格局的主要矛盾和问题，从扩大内需与供给侧结构性改革结合、发展实体经济、科技自立自强、产业链供应链优化升级四个方面着力。"}, {"p": "6-4-1　建设现代化产业体系", "f": "★★★★★", "t": "单选、多选、简答", "c": "现代化产业体系是国家经济现代化的重要标志。加快建设以实体经济为支撑的现代化产业体系，关系我们在未来发展和国际竞争中赢得战略主动。建设现代化经济体系是我国发展的战略目标，是推动高质量发展、全面提高经济整体竞争力的必然要求。"}, {"p": "6-4-2　全面推进乡村振兴", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "农业强国是社会主义现代化强国的根基。没有农业强国就没有整个现代化强国；没有农业农村现代化，社会主义现代化就是不全面的。必须走中国特色社会主义乡村振兴道路，全面推进乡村振兴。"}, {"p": "6-4-3　促进区域协调发展", "f": "★★★★☆", "t": "单选、多选、简答", "c": "促进区域协调发展，是贯彻新发展理念的重要内容，也是实现高质量发展的必然要求。总思路是按照客观经济规律调整完善区域政策体系，发挥各地区比较优势，形成主体功能明显、优势互补、高质量发展的区域经济布局。"}]}, {"name": "第七章　社会主义现代化建设的教育、科技、人才战略", "items": [{"p": "7-1-1　坚持教育发展、科技创新、人才培养一体推进", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。三者具有内在一致性和相互支撑性，必须一体推进教育强国、科技强国、人才强国建设。"}, {"p": "7-1-2　深入实施科教兴国战略、人才强国战略、创新驱动发展战略", "f": "★★★★★", "t": "单选、多选、简答", "c": "实施科教兴国战略、人才强国战略、创新驱动发展战略，是增强综合国力、满足人民群众美好生活需要的必然要求，是建设教育强国、科技强国、人才强国的重大举措。三者既相互融合又各有侧重，要加强统筹、有效联动、系统集成。"}, {"p": "7-1-3　坚持教育优先发展、科技自立自强、人才引领驱动", "f": "★★★★★", "t": "单选、多选、简答", "c": "推进教育、科技、人才事业发展，要紧紧围绕全面建设社会主义现代化国家战略需求，尊重客观规律，坚持教育优先发展、科技自立自强、人才引领驱动。三者各有侧重：教育优先发展重在夯实人力资源深度开发基础，科技自立自强重在坚持独立自主开拓创新，人才引领驱"}, {"p": "7-2-1　教育是民族振兴、社会进步的基石", "f": "★★★★★", "t": "单选、多选、简答", "c": "教育是国之大计、党之大计，是民族振兴、社会进步的基石，在国家发展中始终具有基础性、先导性、全局性地位。建设教育强国是全面建成社会主义现代化强国的战略先导。"}, {"p": "7-2-2　落实立德树人根本任务", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "育人的根本在于立德。落实立德树人根本任务，必须着力解决好培养什么人、怎样培养人、为谁培养人的问题，这是教育的根本问题，也是建设教育强国的核心课题。"}, {"p": "7-2-3　办好人民满意的教育", "f": "★★★★☆", "t": "单选、多选、简答", "c": "人民满意是发展教育的根本尺度。加快建设教育强国，最终是办好人民满意的教育。要坚持以人民为中心发展教育，不断增强人民的教育获得感。"}, {"p": "7-3-1　科技强则国家强", "f": "★★★★☆", "t": "单选、多选、简答", "c": "科技自立自强是国家强盛之基、安全之要。科技兴则民族兴，科技强则国家强。实现高水平科技自立自强，是国家强盛和民族复兴的战略基石、应对风险挑战和维护国家利益的必然选择、构建新发展格局和推动高质量发展的内在要求。"}, {"p": "7-3-2　打赢关键核心技术攻坚战", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "关键核心技术是国之重器，是要不来、买不来、讨不来的。只有把最关键最核心的技术掌握在自己手中，才能从根本上保障国家经济安全、国防安全和其他安全。必须发挥新型举国体制优势，打赢关键核心技术攻坚战。"}, {"p": "7-3-3　增强自主创新能力", "f": "★★★★★", "t": "单选、多选、简答", "c": "自力更生是中华民族自立于世界民族之林的奋斗基点，自主创新是我们攀登世界科技高峰的必由之路。实现高水平科技自立自强，必须增强自主创新能力，坚定不移走中国特色自主创新道路。"}, {"p": "7-4-1　培养人才是国家和民族长远发展大计", "f": "★★★★☆", "t": "单选、多选、简答", "c": "千秋基业，人才为先。国家发展靠人才，民族振兴靠人才。人才是实现民族振兴、赢得国际竞争主动的战略资源，实施人才强国战略、建设规模宏大、结构合理、素质优良的人才队伍，是我国社会主义现代化建设的必然选择。"}, {"p": "7-4-2　培养造就大批德才兼备的高素质人才", "f": "★★★★★", "t": "单选、多选、简答", "c": "功以才成，业由才广。必须完善人才战略布局，提高人才自主培养能力，抓好国家战略人才力量储备，建设世界重要人才中心和创新高地，培养造就大批德才兼备的高素质人才。"}, {"p": "7-4-3　把各方面优秀人才集聚到党和国家事业中来", "f": "★★★★☆", "t": "单选、多选、简答", "c": "\"水积而鱼聚，木茂而鸟集。\"建设人才强国，要坚持人才引领发展的战略地位，深化人才发展体制机制改革，营造识才爱才敬才用才的环境，把各方面优秀人才集聚到党和国家事业中来。"}]}, {"name": "第8章　发展全过程人民民主", "items": [{"p": "8-1-1　人民民主是社会主义的生命", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点回答\"为什么必须发展人民民主\"。核心判断是：人民民主是社会主义的生命，没有民主就没有社会主义，就没有社会主义的现代化，就没有中华民族伟大复兴。论证分三层：民主的一般道理（民主是历史的、具体的、发展的）→党追求民主的历史进程→人民民主"}, {"p": "8-1-2　中国特色社会主义政治制度行得通、有生命力、有效率", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点回答\"我们的政治制度凭什么自信\"。教材先给理论前提——民主首先而且主要是一种国家制度；再给制度结构——根本政治制度、基本政治制度、重要政治制度构成的\"四梁八柱\"；再给形成逻辑——从中国社会土壤中生长起来；最后给实践优势——四个\"能够"}, {"p": "8-1-3　坚定不移走中国特色社会主义政治发展道路", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "这一考点回答\"走什么路、怎么走路\"。教材给出三条要求：坚持党的领导、人民当家作主、依法治国有机统一（根本要求）；积极稳妥推进政治体制改革（动力）；始终保持政治定力（底线）。其中\"三者有机统一\"是全书最高频的表述，也是连接第九章的枢纽。"}, {"p": "8-2-1　全过程人民民主是社会主义民主政治的伟大创造", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点解决\"全过程人民民主从哪来、是什么\"。前半段是提出脉络（一条时间线，考单选最多），后半段是\"四个统一\"的结构性界定（考多选最多）。一句话：它是新时代我国民主政治领域具有重大创新意义的标志性成果，实现了过程民主和成果民主、程序民主和实"}, {"p": "8-2-2　全过程人民民主是全链条、全方位、全覆盖的民主", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点回答\"全过程人民民主的形态特征\"。三个维度各有分工：全链条讲时间（五个环节贯通），全方位讲空间（各层面各维度贯通，含五级人大），全覆盖讲领域（\"五位一体\"\"四个全面\"的方方面面）。三者合起来支撑\"四性\"。"}, {"p": "8-2-3　全过程人民民主是最广泛、最真实、最管用的民主", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一考点回答\"好在哪\"，是本章的价值评判落点。\"最广泛\"讲主体与权利的覆盖面，\"最真实\"讲从意愿到政策的转化链条，\"最管用\"讲治理效能（用六个\"切实防止\"反向证明）。评判标准是教材给出的两句话：实践最有说服力，人民最有发言权。"}, {"p": "8-3-1　加强人民当家作主制度保障", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点是本章的\"制度骨架\"，必须把三层制度的分工与各自的具体要求背清。总纲一句：我国的各项国家制度都是围绕人民当家作主构建的，国家治理体系都是围绕实现人民当家作主运转的。结构上按\"根本—基本—重要\"三层展开，最后落到\"制度成熟定型是一个动"}, {"p": "8-3-2　全面发展协商民主", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "这一考点回答\"协商民主是什么、为什么重要、怎么发展\"。核心定位两句：协商民主是实践全过程人民民主的重要形式；是中国社会主义民主政治中独特的、独有的、独到的民主形式。它与选举民主\"相互补充、相得益彰\"，绝不是相互替代。"}, {"p": "8-3-3　积极发展基层民主", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"民主如何落到最末端\"。三个定位要记准：基层民主是全过程人民民主的重要体现；发展基层民主是实现人民有效政治参与的重要渠道，是人民当家作主的有效途径，是社会主义民主最广泛的实践。落点是坚持和完善基层群众自治制度。"}, {"p": "8-4-1　统一战线是凝聚人心、汇聚力量的强大法宝", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点是统战部分的总论，四个层次必须背全：地位（两个\"重要法宝\"、三个\"更加重要\"）→本质（大团结大联合，解决人心和力量问题）→方法（求同存异，一致性和多样性相统一，交朋友）→领导（党的领导是最鲜明的特征）。"}, {"p": "8-4-2　铸牢中华民族共同体意识", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点含民族与宗教两块，主线是\"意识—认同—行动\"。起点两句：民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本。核心一句：铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念"}, {"p": "8-4-3　加强和促进海内外中华儿女大团结", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点是统战部分的收口，回答\"团结谁、怎么团结\"。总纲：促进中华儿女大团结，是新时代爱国统一战线的历史责任。展开三条：举旗（爱国主义、社会主义）、抓重点领域（六个方面）、辩证把握四方面关系（固守圆心和扩大共识、潜绩和显绩、原则性和灵活性、"}]}, {"name": "第9章　全面依法治国", "items": [{"p": "9-1-1　全面依法治国是国家治理的一场深刻革命", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"为什么必须全面依法治国\"。三条论据：法治是治国理政的基本方式（历史规律）；全面依法治国是坚持和发展中国特色社会主义的本质要求和重要保障（制度逻辑）；全面依法治国为制度之治提供最基本最稳定最可靠的保障（治理效能）。最后用党的十八"}, {"p": "9-1-2　全面依法治国的唯一正确道路", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一考点是第九章的\"方向论\"，考频最高。结构极清晰：一个判断（唯一正确道路）＋三句核心要义（党的领导、中国特色社会主义制度、法治理论）＋五项原则（党的领导、以人民为中心、法律面前人人平等、依法治国和以德治国相结合、从中国实际出发）。核心要义"}, {"p": "9-1-3　统筹处理全面依法治国的重大关系", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点讲\"方法论\"，四对关系必须成组记忆：政治和法治、改革和法治、依法治国和以德治国、依法治国和依规治党。每对关系都有固定结论句，考试常直接挖空。其中\"党和法的关系\"是政治和法治关系的集中反映，是全面依法治国的一个根本问题。"}, {"p": "9-2-1　全面推进依法治国的总抓手", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点回答\"抓什么\"。一句话：建设中国特色社会主义法治体系，既是全面推进依法治国的总目标的重要组成部分，也是总抓手。必须记准\"从法律体系到法治体系\"这一认识飞跃，以及五大体系的完整名称。"}, {"p": "9-2-2　坚持依宪治国、依宪执政", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点讲\"宪法在法治体系中的地位\"。两个\"首先要\"是标志性表述；两个\"必须\"是操作要求：坚持党的领导地位和国体政体不动摇、全面贯彻实施宪法。特别要记住\"同西方所谓'宪政'有着本质区别\"这一界限。"}, {"p": "9-2-3　更好推进中国特色社会主义法治体系建设", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点是\"五大体系\"的展开版，答题必须\"一体系一段\"。总纲：法治体系是国家治理体系的骨干工程。五个体系各有定语，不能互换：完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系、完善的党内法规体系。"}, {"p": "9-3-1　法治中国建设的总体目标", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"建成什么样、什么时候建成\"。三块内容：提出脉络（十八届三中全会首次提出、2020年规划印发）；总体目标的六句表述；两个时间节点（2025年、2035年）。时间节点最容易记混，必须成对记。"}, {"p": "9-3-2　法治中国建设的工作布局", "f": "★★★★★", "t": "单选、多选、简答", "c": "这一考点讲\"怎么布局\"，是三组并列关系：\"依法治国、依法执政、依法行政共同推进\"（主体维度）；\"法治国家、法治政府、法治社会一体建设\"（对象维度）；\"统筹推进国内法治和涉外法治\"（空间维度）。三组关系常混，必须各记各的定位。"}, {"p": "9-3-3　建设更高水平的法治中国", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一考点是本章的收口，按\"十六字方针\"四步展开：科学立法、严格执法、公正司法、全民守法。每一步都有固定抓手：立法讲质量与重点领域，执法讲法治政府与行政执法体制改革，司法讲司法责任制与制约监督，守法讲法治社会与法治宣传教育。"}]}, {"name": "第10章　建设社会主义文化强国", "items": [{"p": "10-1-1　文化繁荣兴盛是实现中华民族伟大复兴的必然要求", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "这一考点用四个\"必然要求\"回答\"为什么必须推动文化繁荣兴盛\"：它是民族复兴的精神支撑、是建设社会主义现代化强国的应有之义、是满足人民美好生活需要的内在要求、是在世界文化激荡中站稳脚跟的前提基础。四个层次依次是：民族—国家—人民—世界，答题时"}, {"p": "10-1-2　坚定中国特色社会主义文化自信", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。建设社会主义文化强国、推动社会主义文化繁荣兴盛，关键在于坚定中国特色社会主义文化自信。文化自信来自三个基础：中华优秀传统文化（深厚基础）、革命文"}, {"p": "10-1-3　坚持中国特色社会主义文化发展道路", "f": "★★★★★", "t": "单选、多选、简答", "c": "中国特色社会主义文化发展道路，是推动社会主义文化繁荣兴盛的唯一正确道路。这条道路的完整表述由\"三个面向\"\"三个属性\"\"一个围绕\"构成：围绕举旗帜、聚民心、育新人、兴文化、展形象建设社会主义文化强国，发展面向现代化、面向世界、面向未来的，民族"}, {"p": "10-2-1　坚持马克思主义在意识形态领域指导地位的根本制度", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "意识形态关乎旗帜、关乎道路、关乎国家政治安全，决定文化前进方向和发展道路。坚持马克思主义在意识形态领域指导地位的根本制度，是中国特色社会主义制度体系的一项根本制度，是坚持和加强党对宣传思想文化工作全面领导的本质要求，是发展社会主义先进文化的"}, {"p": "10-2-2　大力加强马克思主义理论建设", "f": "★★★★☆", "t": "单选、多选、简答", "c": "加强马克思主义理论建设，是不断巩固马克思主义在意识形态领域的指导地位、不断巩固全党全国人民团结奋斗的共同思想基础的必然要求。任务有三项：坚持用马克思主义特别是中国化时代化的马克思主义武装全党、教育人民、指导实践；深化马克思主义理论研究和建设"}, {"p": "10-2-3　积极塑造主流舆论新格局", "f": "★★★★☆", "t": "单选、多选、简答", "c": "新闻舆论工作处在意识形态斗争前沿，是治国理政、定国安邦的大事。舆论导向正确，就能凝聚人心、汇聚力量；舆论导向错误，就会动摇人心、瓦解斗志。塑造主流舆论新格局，要抓住三条：坚持党性原则、坚持正确舆论导向；加快媒体融合发展、做大做强主流舆论阵地"}, {"p": "10-3-1　广泛践行社会主义核心价值观", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "核心价值观是一个民族赖以维系的精神纽带，是一个国家共同的思想道德基础。社会主义核心价值观以24字为基本内容，把国家、社会、公民三个层面的价值要求融为一体，回答了我们要建设什么样的国家、建设什么样的社会、培育什么样的公民的重大问题。广泛践行，"}, {"p": "10-3-2　弘扬以伟大建党精神为源头的中国共产党人精神谱系", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "人无精神则不立，国无精神则不强。100多年前，中国共产党的先驱们创建了中国共产党，形成了伟大建党精神。以伟大建党精神为源头的中国共产党人精神谱系，是党带领人民战胜艰难险阻、取得一个又一个伟大胜利的精神丰碑，是中华民族的宝贵精神财富，也是社会"}, {"p": "10-3-3　提高全社会文明程度", "f": "★★★★☆", "t": "单选、多选、简答", "c": "文明是现代化国家的显著标志。推动社会文明程度不断提高，是全面建设社会主义现代化国家的重要目标，也是建设社会主义文化强国的重大任务。必须坚持重在建设、以立为本，从三方面着力：广泛开展理想信念教育、实施公民道德建设工程、培育时代新风新貌，努力形"}, {"p": "10-4-1　传承发展中华优秀传统文化", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "不忘本来才能开辟未来，善于继承才能更好创新。中华优秀传统文化是中华文明的智慧结晶和精华所在，是中华民族的根和魂。传承发展要抓住三条：深刻把握中华文明的五个突出特性；推动创造性转化、创新性发展；保护好、传承好文化遗产。其中\"两个结合\"是总纲，"}, {"p": "10-4-2　繁荣发展文化事业和文化产业", "f": "★★★★☆", "t": "单选、多选、简答", "c": "繁荣发展文化事业和文化产业，是满足人民精神文化需求、保障人民文化权益的基本途径。要大力发展文化事业和文化产业，以文化人、以文育人、以文培元，增强人民精神力量、促进人的全面发展。具体分三块：抓好文艺创作、提升公共文化服务水平、发展文化产业。"}, {"p": "10-4-3　不断提升国家文化软实力和中华文化影响力", "f": "★★★★☆", "t": "单选、多选、简答、论述", "c": "一个大国发展兴盛，必然要求文化传播力、文明影响力大幅提升，实现软实力和硬实力相得益彰。文化软实力集中体现了一个国家基于文化而具有的凝聚力和生命力，以及由此产生的吸引力和影响力。提升的路径有两条：广泛传播当代中国价值观念、充分展示中华文化独特"}]}, {"name": "第11章　以保障和改善民生为重点加强社会建设", "items": [{"p": "11-1-1　民生是人民幸福之基", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "治国有常，利民为本。民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国家命运兴衰。增进民生福祉有三重定位：是坚持立党为公、执政为民的本质要求，是社会主义生产的根本目的，是全面建设社会主义现代化国家的应有之义。"}, {"p": "11-1-2　人民获得感幸福感安全感更加充实、更有保障、更可持续", "f": "★★★★☆", "t": "单选、多选、简答、材料", "c": "民生无小事，枝叶总关情。党的十八大以来，党中央注重加强普惠性、基础性、兜底性民生建设，坚决打赢脱贫攻坚战，着力解决人民群众急难愁盼问题，扎实推进共同富裕，不断增强人民获得感、幸福感、安全感。这一考点是\"成绩单\"，由一条底线（脱贫攻坚）和六个"}, {"p": "11-1-3　坚持在发展中增进民生福祉", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "发展是解决民生问题的\"总钥匙\"，民生是发展的\"指南针\"。要在发展过程中始终注重民生、保障民生、改善民生，根据经济发展和财力状况，逐步提高人民生活水平。这一考点给出四句话的方法论：正确把握民生和发展的关系（前提）、坚守底线、突出重点、完善制度"}, {"p": "11-2-1　完善分配制度", "f": "★★★★☆", "t": "单选、多选、简答", "c": "收入分配是民生之源，是改善民生、实现发展成果由人民共享最重要最直接的方式。分配制度是促进共同富裕的基础性制度。完善的方向是构建初次分配、再分配、第三次分配协调配套的制度体系：初次分配发挥基础性作用，再分配发挥调节作用，第三次分配靠公益慈善。"}, {"p": "11-2-2　实施就业优先战略", "f": "★★★★☆", "t": "单选、多选、简答", "c": "就业是最基本的民生，是劳动者赖以生存和发展的基础、共享经济发展成果的基本条件，关系到亿万劳动者及其家庭的切身利益。习近平指出：\"就业是最大的民生工程、民心工程、根基工程，必须抓紧抓实抓好。\"解决好就业问题，是民生改善的\"温度计\"，对国家长治"}, {"p": "11-2-3　健全社会保障体系", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "社会保障是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障，是促进经济社会发展、实现广大人民群众共享改革发展成果的重要制度安排，发挥着民生保障安全网、收入分配调节器、经济运行减震器的作用，是治国安邦的大问题。健全的目标是覆盖全民、统"}, {"p": "11-2-4　推进健康中国建设", "f": "★★★★☆", "t": "单选、多选、简答", "c": "人民健康是社会文明进步的基础，是民族昌盛和国家富强的重要标志，是促进人的全面发展的必然要求。习近平指出，人民健康是社会主义现代化的重要标志。推进健康中国建设，要把保障人民健康放在优先发展的战略位置，坚持大卫生大健康理念，努力全方位、全周期保"}, {"p": "11-3-1　加强和创新社会治理", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "社会治理是国家治理的重要领域，推进社会治理现代化是推进国家治理体系和治理能力现代化的重要内容。加强和创新社会治理，就是要在党的领导下，以政府为主导，以社会多元主体参与为基础，以维护人民群众根本利益为核心，依法对社会事务、社会组织和社会生活进"}, {"p": "11-3-2　完善社会治理体系", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "社会治理体系是进行社会治理的基础，也是提高社会治理效能的保障。党的十九届四中全会提出，要完善党委领导、政府负责、民主协商、社会协同、公众参与、法治保障、科技支撑的社会治理体系。完善路径三条：以理念为先导（共建共治共享）、以制度为保障（健全治"}, {"p": "11-3-3　加强城乡社区治理", "f": "★★★★☆", "t": "单选、多选、简答", "c": "基础不牢，地动山摇。基层治理是国家治理的基石，城乡社区是社会治理最基本的单元，是党和政府联系、服务居民群众的\"最后一公里\"。社会治理的重心必须向基层下移，落实到城乡社区，努力打造和谐有序、绿色文明、创新包容、共建共享的幸福家园。"}]}, {"name": "第12章　建设社会主义生态文明", "items": [{"p": "12-1-1　生态兴则文明兴", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"为什么必须建设生态文明\"，用三重论证立论：人与自然是生命共同体（本体论）；生态环境变化直接影响文明兴衰演替（历史规律）；生态文明是人类文明发展的历史趋势（未来方向）。最后落到中国的现实紧迫性上。"}, {"p": "12-1-2　绿水青山就是金山银山", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这是本章的核心考点，也是习近平生态文明思想最具标识性的理念。它回答经济发展与生态环境保护是什么关系：二者不是对立的两难，而是辩证统一、相辅相成；保护生态环境就是保护生产力，改善生态环境就是发展生产力。"}, {"p": "12-1-3　把生态文明建设摆在全局工作的突出位置", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"生态文明建设摆到什么位置、靠什么摆上去\"。定位是三句话：重大经济问题、关系党的使命宗旨的重大政治问题、关系民生福祉的重大社会问题。抓手是\"从思想、法律、体制、组织、作风上全面发力\"，标志是六个\"纳入\"和四个\"重大转变\"。"}, {"p": "12-2-1　加快形成绿色生产方式和生活方式", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一考点回答\"生态环境问题从源头怎么解\"。总判断：绿色发展是新发展理念的重要内容，是发展观的一场深刻革命；要把绿色低碳发展作为解决生态环境问题的治本之策。四条抓手：调结构、节约集约利用资源、积极稳妥推进\"双碳\"、健全保障体系，最后落到全体人"}, {"p": "12-2-2　坚持山水林田湖草沙一体化保护和系统治理", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"生态系统怎么治\"。总判断：山水林田湖草沙是一个生命共同体，是不可分割的生态系统，必须按生态系统的整体性、系统性及其内在规律，整体保护、系统修复、综合治理。五条具体路径：重大工程、自然保护地体系、国土绿化与荒漠化治理、生物多样性"}, {"p": "12-2-3　用最严格制度最严密法治保护生态环境", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"靠什么管住生态环境\"。总判断：保护生态环境必须依靠制度、依靠法治；只有实行最严格的制度、最严密的法治，才能为生态文明建设提供可靠保障。制度体系分三块：最严格的生态环境保护制度、资源高效利用制度、生态环境保护责任制度。"}, {"p": "12-3-1　保护人类共同家园", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "这一考点回答\"为什么生态问题必须全球合作\"。核心判断：地球是全人类赖以生存的唯一家园，保护生态环境、推动可持续发展是各国的共同责任；面对生态环境挑战，人类是一荣俱荣、一损俱损的命运共同体，任何一国单打独斗都无法解决。"}, {"p": "12-3-2　共建清洁美丽世界", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"全球生态治理按什么原则来\"。总判断：建设人与自然和谐共生的地球家园，要以绿色转型为驱动，坚持多边主义，推动全球环境治理体系更加公平合理。四条原则：以人为本、科学治理、多边主义、共同但有区别的责任原则。"}, {"p": "12-3-3　积极推动全球可持续发展", "f": "★★★★☆", "t": "单选、多选、简答" 选、多选、简答、论述", "c": "这一考点是全章理论密度最高的一节，五条内涵：根本宗旨（维护国家主权、安全、发展利益，保持港澳长期繁荣稳定）、\"一国\"与\"两制\"的关系、\"一国\"是根是本、中央全面管治权与高度自治权相统一、\"爱国者治港\"\"爱国者治澳\"、依法治港治澳。其中\"一国"}, {"p": "15-1-3　坚持和完善\"一国两制\"制度体系", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点回答\"好制度怎么定型\"。总判断：\"一国两制\"作为党和国家的大政方针，必须通过具体的制度体系、制度安排、制度规则呈现出来、落到实处。三条路径：加强依法治理相关制度和机制建设、健全中央行使全面管治权的制度、为落实爱国者治理提供制度保障。"}, {"p": "15-2-1　香港、澳门保持长期稳定发展良好态势", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "这一考点讲\"实践成效\"，是本章的事实支撑部分。三条：一是\"一国两制\"实践取得举世公认的成功，是好制度；二是中央的态度一以贯之（2012年\"三个不会变\"、2022年\"三个全力支持\"）；三是在中央支持下港澳独特优势巩固、发展成就具体可感，青少年"}, {"p": "15-2-2　推动香港进入由乱到治走向由治及兴的新阶段", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一考点讲\"重大转折\"，是港澳部分的政治含量最高处。逻辑是：底线不容触碰→香港一度出现严峻局面→中央采取标本兼治举措（三件事：建立健全维护国家安全的法律制度和执行机制、完善选举制度、坚持以行政长官为核心的行政主导体制）→实现由乱到治的重大转"}, {"p": "15-2-3　支持香港、澳门融入国家发展大局", "f": "★★★★☆", "t": "单选、多选、简答", "c": "这一考点讲\"往哪里走\"。前提是\"背靠祖国、联通世界\"是港澳的显著优势；判断是\"一国两制\"是最大优势、国家改革开放是最大舞台、共建\"一带一路\"和粤港澳大湾区建设是新的重大机遇；路径是四个\"积极主动\"：助力国家全面开放、参与粤港澳大湾区建设、参"}, {"p": "15-3-1　实现祖国完全统一是中华民族伟大复兴的必然要求", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一考点是涉台部分的总论，讲\"为什么必然统一\"。四条论据：历史大势（时和势决定，不可阻挡）、法理事实（两岸同属一个中国）、利益逻辑（台湾前途在于国家统一，台湾同胞福祉系于民族复兴）、反面论证（\"台独\"是历史逆流，是绝路）。涉台表述必须逐字照"}, {"p": "15-3-2　坚持贯彻新时代党解决台湾问题的总体方略", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "这一考点是全章第二个\"数字概括\"硬点：\"十个坚持\"。十个坚持不是并列堆砌，每一条都对应一个定位词：根本保证、历史方位、战略思路、大政方针、政治基础、实践途径、根本动力、必然要求、外部条件、战略支撑。记法：按\"领导—进程—基础—方针—政治—途"}, {"p": "15-3-3　牢牢把握两岸关系主导权和主动权", "f": "★★★★☆", "t": "单选、多选、简答", "c": "把握两岸关系主导权和主动权，推动两岸关系朝着正确方向发展，必须坚持一个中国原则和\"九二共识\"，坚决反对\"台独\"分裂行径，坚决反对外部势力干涉。"}]}, {"name": "第16章　中国特色大国外交和推动构建人类命运共同体", "items": [{"p": "16-1-1　当今世界正经历百年未有之大变局", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "百年未有之大变局，是新时代中国外交所处的世界坐标。它既包含和平、发展、合作、共赢的历史潮流不可阻挡这一基本面，也包含不稳定性不确定性突出、全球性问题加剧这一严峻面。正确认识这一变局，是制定对外战略、开展对外工作的前提。"}, {"p": "16-1-2　中国必须有自己特色的大国外交", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "中国特色大国外交，是新时代中国外交的总形态。它以正确的历史观、大局观、角色观为认识前提，以服务民族复兴、促进人类进步为主线，以五条原则要求为遵循，展现出四种独特风范，回答的是\"中国要办什么样的外交、怎样办外交\"。"}, {"p": "16-1-3　我国国际影响力、感召力、塑造力显著提升", "f": "★★★★☆", "t": "单选、多选、简答", "c": "新时代中国特色大国外交是在国际局势风云变幻、各种严峻考验接踵而至的形势下进行的。党中央统筹国内国际两个大局，办成了不少大事难事，推动外交工作取得全方位、开创性历史成就，我国国际影响力、感召力、塑造力显著提升。"}, {"p": "16-2-1　坚持走和平发展道路", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "坚持走和平发展道路，是我们党根据时代发展潮流和我国根本利益作出的战略抉择，是新时代中国外交的基本原则。它不是权宜之计，更不是外交辞令，而是从历史、现实、未来的客观判断中得出的结论，是思想自信和实践自觉的有机统一。"}, {"p": "16-2-2　推动构建新型国际关系", "f": "★★★★☆", "t": "单选、多选、简答", "c": "推动构建新型国际关系，就是要秉持相互尊重、公平正义、合作共赢原则，走出一条对话而不对抗、结伴而不结盟的国与国交往新路。这是新时代中国外交理论和实践的重要创新，具体展开为大国、周边、发展中国家、政党四条线。"}, {"p": "16-2-3　坚决维护国家主权、安全、发展利益", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "维护国家主权、安全、发展利益是我国对外工作的出发点和落脚点，是中国外交的神圣使命。中国走和平发展道路，但决不放弃正当权益、决不牺牲国家核心利益，必须敢于斗争、善于斗争。"}, {"p": "16-2-4　坚持外交为民", "f": "★★★☆☆", "t": "单选、多选、简答", "c": "中国外交是人民的外交，始终坚定维护人民利益，坚持为了人民、服务人民。外交为民体现在两条线上：一是维护海外公民和法人正当权益，二是积极开展民间外交、促进民心相通。"}, {"p": "16-3-1　构建人类命运共同体是世界各国人民前途所在", "f": "★★★★★", "t": "单选、多选、简答、论述、材料", "c": "构建人类命运共同体，是我们党审视当今世界发展趋势、针对当今世界面临的重大问题提出的重要理念，是当代中国共产党人回答和解决关乎人类前途命运的时代之问的中国方案，是应对人类共同挑战、建设更加繁荣美好世界的人间正道，也是新时代对外工作的总目标。"}, {"p": "16-3-2　推动构建人类命运共同体的价值基础和重要依托", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "理念引领行动，方向决定出路。推动构建人类命运共同体，必须弘扬全人类共同价值，落实全球发展倡议、全球安全倡议、全球文明倡议，广泛凝聚共识、汇聚力量。前者是价值基础，后者是重要依托。"}, {"p": "16-3-3　积极参与全球治理体系改革和建设", "f": "★★★★☆", "t": "单选、多选、简答、材料", "c": "推进全球治理体系改革和建设，是完善全球治理、增进世界各国人民福祉的客观要求，也是构建人类命运共同体的内在要求。要秉持共商共建共享的全球治理观，坚持真正的多边主义，推动全球治理体系朝着更加公正合理的方向发展。"}, {"p": "16-3-4　高质量共建\"一带一路\"", "f": "★★★★★", "t": "单选、多选、简答、论述、材料", "c": "共建\"一带一路\"是对中国与世界实现开放共赢路径的顶层设计，是推动构建人类命运共同体的实践平台。它根植历史、更面向未来，源于中国、更属于世界，追求的是发展，崇尚的是共赢，传递的是希望。"}]}, {"name": "第17章　全面从严治党", "items": [{"p": "17-1-1　打铁必须自身硬", "f": "★★★★☆", "t": "单选、多选、简答", "c": "\"打铁必须自身硬\"是新时代党的建设的逻辑起点。它回答的是：党要领导人民完成伟大事业，自身必须先过硬。从\"打铁还需自身硬\"到\"打铁必须自身硬\"，一字之变，反映出刀刃向内的非凡勇气和高度清醒。"}, {"p": "17-1-2　坚定不移全面从严治党", "f": "★★★★★", "t": "单选、多选、简答、论述", "c": "全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路，是新时代党的建设的鲜明主题。其内在规定性可以概括为：核心是加强党的领导，基础在全面，关键在严，要害在治；其实践形态是构建全面从严治党体系。"}, {"p": "17-1-3　全面从严治党取得历史性开创性成就", "f": "★★★★☆", "t": "单选、多选、简答", "c": "党的十八大以来，党中央以真抓的实劲、敢抓的狠劲、善抓的巧劲、常抓的韧劲推进全面从严治党，管党治党宽松软状况得到根本扭转，风清气正的党内政治生态不断形成和发展，取得历史性、开创性成就，并积累了六条重要经验。"}, {"p": "17-2-1　把党的政治建设摆在首位", "f": "★★★★★", "t": "单选、多选、简答、论述、材料", "c": "党的政治建设是党的根本性建设。把政治建设纳入党的建设总体布局并摆在首位，是新时代我们党对马克思主义党建理论的重大创新。其首要任务是保证全党服从中央，维护党中央权威和集中统一领导。"}, {"p": "17-2-2　思想建设是党的基础性建设", "f": "★★★★☆", "t": "单选、多选、简答", "c": "坚持思想建党、理论强党，是党的事业发展的重要法宝。深入推进全面从严治党，必须把思想建设作为基础性建设，教育引导党员干部用习近平新时代中国特色社会主义思想凝心铸魂。"}, {"p": "17-2-3　贯彻新时代党的组织路线", "f": "★★★★☆", "t": "单选、多选、简答", "c": "党的力量来自组织。贯彻新时代党的组织路线，重点是严密党的组织体系，关键是建设高素质专业化干部队伍，目标是把党的各级组织都健全、都过硬，为建设长期执政的马克思主义政党提供组织保证。"}, {"p": "17-2-4　以严的基调强化正风肃纪", "f": "★★★★☆", "t": "单选、多选、简答", "c": "党的作风就是党的形象，关系人心向背，关系党的生死存亡；纪律是管党治党的\"戒尺\"。党性是根本，党风是表现，党纪是保障，必须坚持党性党风党纪一起抓，正风必须肃纪。"}, {"p": "17-2-5　把制度建设贯穿到党的各项建设之中", "f": "★★★★☆", "t": "单选、多选、简答", "c": "法规制度带有根本性、全局性、稳定性、长期性。从严治党要靠思想教育，也要靠制度保障，靠制度是长远之策、根本之策。要把制度建设贯穿到党的各项建设之中，坚持制度治党、依规治党。"}, {"p": "17-3-1　腐败是党长期执政面临的最大威胁", "f": "★★★★★", "t": "单选、多选、简答、材料", "c": "腐败是危害党的生命力和战斗力的最大毒瘤，是党长期执政面临的最大威胁。反腐败是最彻底的自我革命，是全面从严治党的\"必答题\"，是一场输不起也决不能输的重大斗争。"}, {"p": "17-3-2　坚持标本兼治开展反腐败斗争", "f": "★★★★☆", "t": "单选、多选、简答", "c": "标本兼治是新时代推进反腐败斗争的鲜明特征，既以治标遏制腐败势头，更注重治本夯实防腐的基础。党中央坚持无禁区、全覆盖、零容忍，成功走出一条依靠制度优势、法治优势反腐败之路。"}]}]}];

  function resize() {
    W = cv.width = innerWidth * devicePixelRatio;
    H = cv.height = innerHeight * devicePixelRatio;
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
  }
  function mk(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -30 * devicePixelRatio,
      r: (4 + Math.random() * 6) * devicePixelRatio,
      vy: (.35 + Math.random() * .7) * devicePixelRatio,
      vx: (Math.random() - .5) * .55 * devicePixelRatio,
      a: Math.random() * Math.PI * 2,
      va: (Math.random() - .5) * .022,
      o: .25 + Math.random() * .5,
      sw: .6 + Math.random() * 1.2
    };
  }
  resize();
  for (let i = 0; i < N; i++) ps.push(mk(true));
  addEventListener('resize', resize);

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.y += p.vy;
      p.x += p.vx + Math.sin(p.y * .006) * p.sw * .3;
      p.a += p.va;
      if (p.y > H + 40) Object.assign(p, mk(false));
      if (p.x < -40) p.x = W + 30;
      if (p.x > W + 40) p.x = -30;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.globalAlpha = p.o;
      // 花瓣：两段贝塞尔
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(p.r * .7, -p.r * .5, p.r * 1.05, p.r * .45, 0, p.r);
      ctx.bezierCurveTo(-p.r * 1.05, p.r * .45, -p.r * .7, -p.r * .5, 0, 0);
      const g = ctx.createLinearGradient(-p.r, -p.r, p.r, p.r);
      g.addColorStop(0, 'rgba(255, 214, 226, .95)');
      g.addColorStop(1, 'rgba(248, 180, 196, .75)');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ---------- 阅读进度条 ---------- */
(function progress() {
  const bar = document.getElementById('prog');
  function upd() {
    const h = document.documentElement.scrollHeight - innerHeight;
    const p = h > 0 ? (scrollY / h) * 100 : 0;
    bar.style.width = Math.min(100, Math.max(0, p)) + '%';
  }
  addEventListener('scroll', upd, { passive: true });
  addEventListener('resize', upd);
  upd();
})();

/* ---------- 背景音乐（Web Audio 生成，无外部文件） ---------- */
(function music() {
  const btn = document.getElementById('btnMusic');
  let actx = null, playing = false, timer = null;
  // 五声音阶，柔和八音盒感
  const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
  function tone(freq, when, dur, gain) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(gain, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(when); o.stop(when + dur);
  }
  function step() {
    if (!playing) return;
    const t = actx.currentTime;
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const f = scale[Math.floor(Math.random() * scale.length)];
      tone(f, t + i * 0.32, 1.1, 0.055);
    }
    timer = setTimeout(step, 1800 + Math.random() * 1600);
  }
  btn.addEventListener('click', () => {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    playing = !playing;
    btn.classList.toggle('on', playing);
    if (playing) { step(); } else { clearTimeout(timer); }
  });
})();

/* ---------- Live2D 看板娘 ---------- */
(function live2d() {
  const box = document.getElementById('live2d');
  const btn = document.getElementById('btnL2d');
  let loaded = false, visible = true;

  function boot() {
    if (loaded) return;
    if (typeof L2Dwidget === 'undefined') return;
    loaded = true;
    try {
      L2Dwidget.init({
        model: { jsonPath: 'live2d/model.json' },
        display: { position: 'right', width: 200, height: 300, hOffset: 0, vOffset: -20 },
        mobile: { show: true, scale: 0.5 },
        react: { opacityDefault: 0.9, opacityOnHover: 0.95 },
        dialog: { enable: true, hitokoto: false }
      });
    } catch (e) { console.warn('Live2D init failed', e); }
  }

  const s = document.createElement('script');
  s.src = 'live2d/L2Dwidget.min.js';
  s.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'live2d/L2Dwidget.0.min.js';
    s2.onload = boot;
    s2.onerror = boot;
    document.body.appendChild(s2);
  };
  s.onerror = () => console.warn('Live2D 加载器失败');
  document.body.appendChild(s);

  btn.addEventListener('click', () => {
    visible = !visible;
    btn.classList.toggle('on', !visible);
    // L2Dwidget 自建 canvas（id=live2dcanvas），直接控它的 display
    const cvs = document.querySelectorAll('#live2dcanvas, #live2d canvas, .live2d-widget');
    if (visible) {
      box.classList.remove('hide');
      cvs.forEach(c => { c.style.display = ''; c.style.opacity = '1'; });
    } else {
      box.classList.add('hide');
      cvs.forEach(c => { c.style.display = 'none'; });
    }
  });
})();

/* ---------- 列表渲染 ---------- */
let filter = 'all';
let kw = '';
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function hl(s) {
  if (!kw) return esc(s);
  const i = s.toLowerCase().indexOf(kw.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + kw.length)) + '</mark>' + esc(s.slice(i + kw.length));
}
function hot(f) { return ((f || '').match(/★/g) || []).length >= 4; }

function render() {
  const root = document.getElementById('list');
  let out = '', shown = 0;
  for (const b of DATA) {
    if (filter !== 'all' && filter !== 'hot' && filter !== b.book) continue;
    let bookHtml = '', bookCount = 0;
    for (const ch of b.chapters) {
      const items = ch.items.filter(it => {
        if (filter === 'hot' && !hot(it.f)) return false;
        if (!kw) return true;
        return (it.p + ' ' + ch.name + ' ' + it.c + ' ' + it.t).toLowerCase().includes(kw.toLowerCase());
      });
      if (!items.length) continue;
      bookCount += items.length;
      bookHtml += '<details class="chap"><summary><span>' + hl(ch.name) +
        '</span><span class="n">' + items.length + ' 篇</span></summary><div class="items">';
      for (const it of items) {
        bookHtml += '<div class="item"><div class="top"><span class="name">' + hl(it.p) +
          '</span><span class="freq">' + esc(it.f) + '</span>' +
          (it.t ? '<span class="types">' + esc(it.t) + '</span>' : '') +
          '</div>' + (it.c ? '<div class="concl">' + hl(it.c) + '…</div>' : '') + '</div>';
      }
      bookHtml += '</div></details>';
    }
    if (bookCount) {
      out += '<div class="book">' + b.book + ' <span class="cnt">' + bookCount + ' 篇</span></div>' + bookHtml;
      shown += bookCount;
    }
  }
  root.innerHTML = shown ? out : '<div class="empty">没有匹配的考点</div>';
}

document.getElementById('q').addEventListener('input', e => { kw = e.target.value.trim(); render(); });
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    filter = c.dataset.f;
    render();
  });
});
render();

setTimeout(() => document.getElementById('hint').classList.add('hide'), 7000);
</script>
