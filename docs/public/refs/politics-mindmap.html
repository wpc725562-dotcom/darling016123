  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.y * .006) * p.sw * .3; p.a += p.va;
      if (p.y > H + 40) Object.assign(p, mk(false));
      if (p.x < -40) p.x = W + 30;
      if (p.x > W + 40) p.x = -30;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = p.o;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.bezierCurveTo(p.r*.7, -p.r*.5, p.r*1.05, p.r*.45, 0, p.r);
      ctx.bezierCurveTo(-p.r*1.05, p.r*.45, -p.r*.7, -p.r*.5, 0, 0);
      const g = ctx.createLinearGradient(-p.r, -p.r, p.r, p.r);
      g.addColorStop(0, 'rgba(255,214,226,.95)');
      g.addColorStop(1, 'rgba(248,180,196,.7)');
      ctx.fillStyle = g; ctx.fill(); ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ---------- 树布局与渲染 ---------- */
const svg = document.getElementById('svg');
const vp = document.getElementById('viewport');
const stage = document.getElementById('stage');

const NODE_H = 26, GAP_Y = 7, LEVEL_X = [0, 210, 470, 760];
let hotOnly = true;
const collapsed = new Set();   // 折叠的章节 id
let uid = 0;

function assignId(n, parentId) {
  n.id = parentId ? parentId + '/' + (++uid) : 'root';
  (n.children || []).forEach(c => assignId(c, n.id));
}
assignId(TREE, '');

// 默认全部折叠到章节级：初始只显示 根 → 2 教材 → 27 章 = 30 个节点
(function foldAll(n) {
  if (n.kind === 'chap') collapsed.add(n.id);
  (n.children || []).forEach(foldAll);
})(TREE);

function hot(f) { return ((f || '').match(/★/g) || []).length >= 4; }

// 构建可见节点树（考虑折叠与筛选）
function build(n, depth) {
  const node = { ...n, depth, kids: [] };
  let kids = n.children || [];
  // 先按考频筛选，再判断章节是否真空
  if (n.kind === 'chap' && hotOnly) kids = kids.filter(k => hot(k.freq));
  const trulyEmpty = n.kind === 'chap' && hotOnly && kids.length === 0;
  // 再应用折叠（折叠不代表空）
  if (n.kind === 'chap' && collapsed.has(n.id)) kids = [];
  node.kids = kids.map(k => build(k, depth + 1));
  if (trulyEmpty) node.empty = true;
  return node;
}

function layout(root) {
  let y = 0;
  const nodes = [], links = [];
  function walk(n) {
    if (!n.kids.length) {
      n.y = y; y += NODE_H + GAP_Y;
    } else {
      n.kids.forEach(walk);
      n.y = (n.kids[0].y + n.kids[n.kids.length - 1].y) / 2;
    }
    n.x = LEVEL_X[n.depth] || (LEVEL_X[3] + (n.depth - 3) * 240);
    nodes.push(n);
    n.kids.forEach(k => links.push({ s: n, t: k }));
  }
  walk(root);
  return { nodes, links, height: y };
}

function textWidth(s) {
  // 粗略估宽：中文 1em，英文 0.55em
  let w = 0;
  for (const ch of s) w += /[\u4e00-\u9fa5]/.test(ch) ? 13 : 7;
  return w;
}

function render() {
  vp.innerHTML = '';
  const root = build(TREE, 0);
  const { nodes, links, height } = layout(root);

  // 连线
  for (const l of links) {
    const x1 = l.s.x + (l.s.w || 100), y1 = l.s.y + NODE_H / 2;
    const x2 = l.t.x, y2 = l.t.y + NODE_H / 2;
    const mx = (x1 + x2) / 2;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    p.setAttribute('class', 'link' + (l.t.kind === 'point' && hot(l.t.freq) ? ' hot' : ''));
    vp.appendChild(p);
  }

  // 节点
  for (const n of nodes) {
    if (n.empty) continue;
    const label = n.kind === 'point' ? n.name : n.name;
    const w = Math.max(70, Math.min(n.depth === 3 ? 300 : 320, textWidth(label) + (n.kind === 'chap' ? 58 : 30)));
    n.w = w;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node ' + n.kind + (n.kind === 'point' && hot(n.freq) ? ' hot' : ''));
    g.setAttribute('transform', `translate(${n.x},${n.y})`);

    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('width', w);
    r.setAttribute('height', NODE_H);
    g.appendChild(r);

    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', 11);
    t.setAttribute('y', NODE_H / 2 + 1);
    t.textContent = label.length > 30 && n.depth === 3 ? label.slice(0, 29) + '…' : label;
    g.appendChild(t);

    // 章节：右侧显示篇数 + 折叠标记
    if (n.kind === 'chap') {
      const b = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      b.setAttribute('x', w - 11);
      b.setAttribute('y', NODE_H / 2 + 1);
      b.setAttribute('text-anchor', 'end');
      b.setAttribute('class', 'badge');
      b.textContent = n.kids.length ? n.kids.length : n.count;
      g.appendChild(b);

      const tg = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      tg.setAttribute('x', w + 6);
      tg.setAttribute('y', NODE_H / 2 + 1);
      tg.setAttribute('class', 'toggle');
      tg.textContent = collapsed.has(n.id) ? '▸' : '▾';
      g.appendChild(tg);
    }
    if (n.kind === 'book') {
      const b = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      b.setAttribute('x', w - 11);
      b.setAttribute('y', NODE_H / 2 + 1);
      b.setAttribute('text-anchor', 'end');
      b.setAttribute('class', 'badge');
      b.textContent = n.count;
      g.appendChild(b);
    }

    if (n.kind === 'chap') {
      g.addEventListener('click', (e) => {
        e.stopPropagation();
        if (collapsed.has(n.id)) collapsed.delete(n.id); else collapsed.add(n.id);
        render();
      });
    }
    vp.appendChild(g);
  }

  // 复位视图（首次渲染时）
  if (!inited) { reset(); inited = true; }
}

/* ---------- 平移缩放 ---------- */
let scale = 1, tx = 0, ty = 0, inited = false;
function apply() {
  vp.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}
function reset() {
  const h = document.querySelector('.head').offsetHeight;
  const availH = innerHeight - h;
  const box = vp.getBBox();
  scale = Math.min(1, Math.min((innerWidth - 120) / box.width, (availH - 100) / box.height));
  scale = Math.max(0.35, scale);
  tx = 60 - box.x * scale;
  ty = (availH - box.height * scale) / 2 - box.y * scale;
  apply();
}

let dragging = false, sx = 0, sy = 0;
stage.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
  stage.classList.add('drag');
});
addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = e.clientX - sx; ty = e.clientY - sy; apply();
});
addEventListener('mouseup', () => { dragging = false; stage.classList.remove('drag'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 0.92 : 1.08;
  const nx = Math.max(0.2, Math.min(2.5, scale * k));
  const r = nx / scale;
  tx = e.clientX - (e.clientX - tx) * r;
  ty = e.clientY - (e.clientY - ty) * r;
  scale = nx; apply();
}, { passive: false });

/* ---------- 按钮 ---------- */
document.getElementById('btnExpand').addEventListener('click', () => {
  collapsed.clear(); render();
});
document.getElementById('btnCollapse').addEventListener('click', () => {
  (function all(n) { if (n.kind === 'chap') collapsed.add(n.id); (n.children || []).forEach(all); })(TREE);
  render();
});
document.getElementById('btnHot').addEventListener('click', (e) => {
  hotOnly = !hotOnly;
  e.target.classList.toggle('on', hotOnly);
  render();
});
document.getElementById('btnReset').addEventListener('click', reset);

render();
addEventListener('resize', () => { render(); });
</script>
</body>
